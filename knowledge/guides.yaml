# Heroes' hates, to read with R45. Each is a guide's Hates line (fact to verify, below).
hero_dislikes_per_guide:
  - "Dwarf hates Dark Elves, Bile Demons"
  - "Elven Archer hates Dark Elves"
  - "Wizard hates Warlocks (converted Wizard beside a Warlock incites rebellion)"
  - "Fairy hates Mistresses, Vampires, Dark Angels"
  - "Monk hates Vampires, Dark Angels"
  - "Guard hates Mistresses"
  - "Giant hates Trolls"
  - "Knight hates Dark Knights, Goblins, Trolls"
  - "Thief hates nothing; Dwarf likes digging; Warlock hates converted Wizards; Troll hates converted Giants"

# ---------------------------------------------------------------------------------------------------------------
# Facts the guides state (numbers and mechanics, not advice). To be verified against the binary by others; never taken
# from the guides. Each names where it was read and which rule leans on it.
facts_to_verify:
  - id: F1
    claim: "The first Portal supports 15 creatures, each further Portal adds 5, to a maximum of 25; Skeletons, Vampires and captured heroes are not counted."
    source: "L a-excavation-and-building"
    rules: [R55]
  - id: F2
    claim: "Each claimed floor tile yields 1 mana a turn; a claimed Mana Vault 100 a turn; the mana store caps at 200,000; room tiles give no more than floor tiles."
    source: "L b-cash-mana-marvellous, a-researching-spells-and-accumulating-mana"
    rules: [R55, R56]
  - id: F3
    claim: "Summon Horny costs 100,000 mana, then drains about 2,000 mana a turn after about 30 seconds; slapping him dismisses him."
    source: "L b-keepers-spell-list; H level 14"
    rules: [R36]
  - id: F4
    claim: "Keeper spell costs: Create Imp 1,500 and +1,500 each cast; Thunderbolt 6,000; Possession 500; Heal 5,000; Sight of Evil 5,000; Call to Arms 10,000; Tremor 30,000; Turncoat 20,000; Create Gold 15,000 (1,500 gold at level 1, 2,000 at level 2); Inferno 50,000 (Giants and Salamanders immune). Casting Create Imp on the Heart returns half the cost."
    source: "L b-keepers-spell-list, a-researching-spells-and-accumulating-mana"
    rules: [R27, R29, R30, R51]
  - id: F5
    claim: "Trap and door gold costs: Sentry 1,000 (5 mana a turn, 250 to fire); Fear 750; Alarm 500; Guard Post 300; Spike 750; Trigger 300; Boulder 1,500; Freeze 1,500; Lightning 3,000 (125 mana a turn); Fireburst 6,000; Wooden Door 500; Braced 1,000; Steel 1,500; Magic 6,000; Secret 3,000; Barricade 400."
    source: "L b-traps, have-time-to-muster-a-defence..., a-doors"
    rules: [R40, R41]
  - id: F6
    claim: "Room costs per tile: Lair 300, Hatchery 300, Treasury 200, Training Room 500. Attractions: Lair draws Fireflies, Goblins (5 tiles), Bile Demons (9 tiles); Hatchery draws Bile Demons at 3x3; Training Room draws Salamanders. CONFLICTS with R4 (Bile Demons need a 25-tile Hatchery); the guides' 5x5 Hatchery advice for Bile Demons in Levels 10 and 13 agrees with R4, the room list does not."
    source: "L a-room-list; L k-smash-woodsong; L n-conversion-cherish"
    rules: [R4, R18]
  - id: F7
    claim: "Training Room trains to level 4, Combat Pit to level 8 (a level-8 creature no longer fights there and is not attacked); levels 9 and 10 only from level-up items and combat; level 5 is a big power jump."
    source: "L e-combat, 7-magic-and-mana"
    rules: [R21]
  - id: F8
    claim: "A creature dropped is stunned for a time that depends on the type (Imps not, Goblins little, Bile Demons long); not stunned if dropped in a Combat Pit."
    source: "L 7-magic-and-mana, a-creature-list, a-warcry-smilesville; H level 1"
    rules: [R35]
  - id: F9
    claim: "Fear Traps affect everything except Skeletons; Skeletons attack enemy cannons outside the dungeon when released."
    source: "H level 5; L e-fear-elmshadow"
    rules: [R15, R37]
  - id: F10
    claim: "Hero kinds and how they end in a Prison: Dwarves rarely rise as Skeletons, Fairies and Thieves do not always, Wizards can; Giants, Guards, Knights, Monks convert (Monks slowly)."
    source: "L a-hero-list"
    rules: [R16, R44]
  - id: F11
    claim: "Creature roles: Blitzers Dark Angel, Dark Mistress, Skeleton, Vampire; Blockers Bile Demon, Troll, Dark Knight (and Giants, Guards, Knights as heroes); Flankers Goblin, Salamander, Rogue, Firefly; Support Warlock, Dark Elf. Threat and speed tables (Dark Angel threat 9, Bile Demon 7, Mistress 5, Skeleton 3, Goblin 2, Imp 1; Dwarf speed 7, Guard speed 3 threat 6, Knight threat 7, Royal Guard threat 8)."
    source: "L e-combat, b-creature-comparison-table, b-hero-comparison-table"
