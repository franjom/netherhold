# What public DK2 text guides say beyond the rules (R21-R64 live in rules.yaml). Nothing here is a game fact and
# no code reads this file: the counters and dislikes are guide claims for the R20/R23 counters table, the
# confirmations say how the guides bear on rules R1-R20, and every number or mechanic under facts_to_verify is
# checked against DKII.EXE before anything leans on it (binary is king). Taken as proposed by the owner, 2026-11-17.
# Source keys: see the R21 header in rules.yaml. Level-by-level notes: docs/research/campaign-guide-levels.md.

# ---------------------------------------------------------------------------------------------------------------
# How existing rules fare against the guides (confirms or refines). Use when reading rules.yaml.
confirmations:
  R1:
    - "Hampton Level 2: Library and Training Room at least 4x4; Level 5: build rooms small at first because there is little space (H). TENSION: R1 says a room under its working size does nothing; the 'small first' advice holds only where the attraction minimum is met (L: Lair 5 tiles for Goblins; Hatchery, Training, Library minimums are rooms.yaml's)."
    - "B Level 10: little rooms quickly to start creatures, then expand."
  R2:
    - "L b-enchantments-sing-song: a Library for 5-6 researchers; finish research marked '?' before ending the level or it is lost for the next. Supports R2 and R57."
  R3:
    - "L b-cash-mana-marvellous: gold with no Treasury space is left lying; supports growing the Treasury."
  R4:
    - "L k-smash-woodsong and n-conversion-cherish: a 5x5 Hatchery for Bile Demons (agrees with 25 tiles). L a-room-list instead lists Bile Demon at a 3x3 Hatchery and 9-tile Lair (older text); rooms.yaml, generated from Creatures.kwd, decides."
  R6:
    - "L c-creature-spell-list and d-first-person-mode: Firefly scouts lava and water; Rogue cloaks; Sight of Evil reveals ground. Adds scouts other than an Imp (a Rogue is spotted by a Guard Room's sphere)."
  R7:
    - "L e-combat: Training Room to 4, Combat Pit to 8, a level-8 creature stops fighting in the pit; heal at two petals; Imps carry the fallen home. Agrees. H level 15: nurse the loser."
  R8:
    - "L a-creature-list: ten Imps for a medium dungeon, fifteen to twenty for a sprawling one (agrees with 'never more than 15-20' and R17's ten). L a-excavation: create at least one more at once and five more when mana allows (disagrees mildly with 'buy only the minimum' while the upgrade is pending)."
  R9:
    - "L have-time-to-muster-a-defence...: Boulder in a long thin corridor behind a weak door; Spike in front of and behind doors; Fear then Sentry or Lightning behind it; Freeze 30 s. Agrees; see R40."
  R10:
    - "L b-hero-comparison-table, a-hero-list: Guards, Giants, Knights worth converting; Monks the exception; others Skeletons or Vampire food. Agrees; see R44, R45."
  R11:
    - "L b-cash-mana-marvellous: Create Gold and selling rooms only as a last resort. Agrees. H level 16 disagrees (see R51)."
  R12:
    - "L b-planning-dungeon-layouts: one tile per Lair, Lairs beside the room where creatures work, Hatchery, Treasury strips together, Guard Room outposts need their own Lairs, Hatchery and cash. B level 4: a Hatchery by each guard post. Refines 'Lair by free beds'."
  R13:
    - "L d-magic-items-specials: boxes sit in corners and crannies of soft rock near bedrock; Imps carry them to the Library if there is one, else leave them. Agrees. L list: Increase Mana, Increase Gold, Fortify/Unfortify Walls, Make Happy/Unhappy, Increase Level, Create Imps, Hidden Land. H and B: finish digging before killing the Lord (R57); several levels hide Increase Level items (Levels 1, 4, B 4); L 15a/15b: Level Up and Increase Mana specials north of the prison."
  R14:
    - "L d-snipers-shadygrove (the guide: lock Imps away, possess a Dark Elf in sniper mode to kill the lookout Dwarf, possessed Troll or group for the Cannons, two Increase Level items saved for the final assault) matches the owner's Level 4 play almost step for step."
    - "H level 8: Imps claim up to the fort, then drop the attack force or Call to Arms; L i-aftermath-snapdragon the same. Confirms 'claim up to the enemy walls, breach, drop the whole army'."
  R15:
    - "Skeletons are the only creatures a Fear Trap does not affect: H level 5, 6b, 13; B level 5; L e-fear-elmshadow, g-rout-sweetwater-b. L e-fear-elmshadow adds: Imp-claimed tiles beside the trap let Skeletons attack it on their own; Skeletons attack cannons outside the dungeon when released, so clear the cannons first."
    - "DISAGREEMENT on Level 8: H has Dark Elves snipe the Fear Trap; L says Mistresses might disable it, otherwise wait for Skeletons. Both are ways to destroy it from outside its fear."
  R16:
    - "H level 5, L e-fear-elmshadow, B 5: Prison on imprisonment, Imps carry the fallen in, Skeletons do not eat or sleep. L a-hero-list: Dwarves rarely rise as Skeletons, Fairies and Thieves not always (fact to verify, bears on R16's expectations)."
  R17:
    - "L a-creature-list: ten Imps for a medium dungeon; agrees. Also L a-excavation-and-building: surplus Imps dropped into the Heart near the end return part of their mana (fact to verify, F4)."
  R18:
    - "L a-room-list: Lair 5 tiles for Goblins, Training Room draws Salamanders; L k-smash-woodsong: a large Hatchery and Workshop make Trolls and Bile Demons arrive before Goblins. Agrees that the missing room, not gold, holds creatures back."
  R19:
    - "H level 5 describes the owner's Level 5 sequence: four Fear Traps, 2 Knights (and Sentry traps in some readings), then Knights, Mages and Dwarves through the Hero Gate, 'make sure every single creature is fighting'. L e-fear-elmshadow: muster Trolls, Goblins, Dark Elves, Warlocks, Thunderbolt Constantine on your ground."

# ---------------------------------------------------------------------------------------------------------------
# Counters: who answers what. Source keys as above. Every entry is a guide's claim; none is verified.
counters:
  - answer: "Skeletons (fearless)"
    against: "Fear Trap"
    kind: creature-vs-trap
    source: "H level 5, 6, 13; B 5; L e-fear-elmshadow, g-rout-sweetwater-b"
    note: "Owner R15. Releasing Skeletons also sends them at nearby cannons (L)."
  - answer: "Dark Elf in sniper mode (possessed)"
    against: "Fear Trap, Gas Traps, Alarm Trap, Sentry Trap, Cannons, a lookout Dwarf, Elven Archers"
    kind: creature-vs-trap
    source: "H level 5, 8, 13 (snipe the four Archers); L d-snipers-shadygrove, d-first-person-mode"
    note: "Out of the trap's range, kills before the alarm sounds."
  - answer: "Possessed Troll (Spot and Disarm Trap)"
    against: "hidden enemy traps; Cannons (smash them)"
    kind: creature-vs-trap
    source: "L d-first-person-mode, d-snipers-shadygrove"
  - answer: "Rogue (stealth, trap disabling, lock picking)"
    against: "hidden traps, locked prisons, Guard Room alarm (but he is spotted inside a Guard Room's sphere)"
