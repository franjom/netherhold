# Where the generated views disagree with each other (2026-10-07, by eye).
inconsistencies:
  - pick: held in the left hand, head down by the right foot, in concept.render; carried by nobody in the turnaround
  - braces: one strap visible over the near shoulder in concept.render; two symmetric riveted braces in the turnaround front, both running to the sack behind
  - digits: four fingers plus a thumb in some hands, fewer readable in others; five toes per foot in the turnaround front, four or five elsewhere (settled by concept.base_front, which shows a thumb and three fingers, and four toes)
  - ears: larger and more horizontal in the turnaround front and rear; more upright in the face close-up
  - eyes: about 45% of the face's width in the close-up; smaller relative to the head in the turnaround
  - skull: tall smooth dome in the close-up; elongated backwards and lumpy in the turnaround side and rear
  - loincloth: one off-centre tattered front flap in concept.render; centred front flap and a back flap in the turnaround
  - skin: olive with red mottling in the close-up; yellower in the turnaround
  - belly plate: an egg-shaped plate under the belt in every view; rejected (ADR-0398)
  - lighting: highlights and shadows are painted into all renders; never read them as geometry or as albedo
# Where concept.base_front and concept.base_rear disagree (2026-10-07). Scale, pose and outline agree.
base_pair_inconsistencies:
  - hands: both views show the backs of the hands, knuckles and the thumbnail; a true rear view would show the palms' little-finger edge
  - ears: both views show the ears' hollow inner face; one pair of ears cannot face both cameras
  - feet: the front shows toes from slightly above, the rear only heels; the toes are not seen from behind
  - skull: the rear shows two large lobes and a central crease that the front's dome does not suggest
  - lighting: rim light and specular highlights painted in, strongest on the eyes and the skull

# The intended split, so accessories stay separate and variants stay cheap.
parts:
  body: { object: IMP_body, includes: [head, ears, hands, feet], material: skin }   # skin colour adjustable
  eyes: { objects: [IMP_eye_L, IMP_eye_R], material: eye }                         # glossy dark red
  teeth: { objects: [IMP_teeth_upper, IMP_teeth_lower], with: mouth interior }
  clothing: { objects: [IMP_braces, IMP_belt, IMP_loincloth_front, IMP_loincloth_back] }
  footwear:   # owner 2026-10-07/08; docs/plans/2026-10-07-imp-footwear.md; built as footwear v001
    ankle_wraps: part of IMP_body; the stud on each is painted detail
    straps: { objects: [IMP_foot_strap_L, IMP_foot_strap_R], material: the body's (one texture set) }
  skull_ornament: { object: IMP_skull_ornament, at: chest, reference: original.textures.impfrnt }
  sack: { object: IMP_sack, default: concept (small, high, rope-tied), variant: original (large) }
  pickaxe: { object: IMP_pickaxe, attach: [hand_R_grip, hand_L_grip], default_hand: right }   # ADR-0399
  accessories_later: [nose piercing, ear piercings, large sack]   # optional, never on the base creature
  surface_detail_later: [pores, warts, mottling, wrinkles]          # textures and normal maps, not geometry

skin_variants: [olive, gray, earthy_brown, muted_red]   # previews in tools/blender/imp_blockout.py

departures:   # ADR-0398, ADR-0399
  - skin colour olive by default (the texture is tan-orange)
  - ears, teeth, braces, buckled belt: from the concepts, absent on the in-game mesh
  - ankle wraps and foot straps: in the DK2 portrait and the concepts, absent on the in-game mesh (bare feet)
  - sack smaller and higher than the original's
  - optional left-handed variant
  - optional piercings as separate accessories

blockouts:   # procedural attempts, kept for comparison, paused 2026-10-07
  path: build/modern/creature/imp/blockout/
  versions: v001-v015
  note: docs/plans/2026-10-07-imp-blockout.md
