name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Authoritative and deliberately invalid: CI has no Dungeon Keeper 2
  # installation, and no test may quietly depend on one. Tests that need the
  # original game skip themselves when this resolves to nothing.
  DK2_DIR: /nonexistent

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms on purpose. The determinism gate pins an exact state
        # hash, so running it on Linux and Windows is what turns "deterministic
        # in this process" into "deterministic across machines".
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DK2.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors, so this is also the
        # style gate.
        run: dotnet build DK2.slnx --no-restore --configuration Release

      - name: Architecture gate (simulation must not reference Unity)
        run: >
          dotnet test tests/DK2.Simulation.Tests/DK2.Simulation.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~ArchitectureTests"

      - name: Determinism gate
        # The project's load-bearing check: same seed and inputs must produce
        # the same state hash at every tick, on every machine. If this fails,
        # nothing downstream that claims behavioural fidelity means anything.
        run: >
          dotnet test tests/DK2.Simulation.Tests/DK2.Simulation.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~DeterminismTests|FullyQualifiedName~SnapshotTests"

      - name: Test
        # EXPECT SKIPS HERE, and read the count. This runner has no Dungeon
        # Keeper 2 installation, so every [InstallFact] / [InstallTheory] test
        # reports as Skipped — 266 of them at the time of writing (ADR-0100).
        #
        # Until 2026-09-07 those tests used `if (install is null) return;` and
        # reported as PASSED, which meant roughly a quarter of a green suite was
        # asserting nothing. If the skip count here ever drops to zero, this
        # runner has somehow acquired the game data; if it climbs sharply,
        # somebody has gated a test that did not need gating.
        #
        # On a machine that IS supposed to have the data, set
        # DK2_REQUIRE_INSTALL=1 to turn a missing install into a failure
        # instead of a skip.
        run: dotnet test DK2.slnx --no-build --configuration Release

  budgets:
    name: recording budgets
    runs-on: ubuntu-latest
    steps:
      # Full history: the check compares against a base commit, and the default
      # shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the tool
        run: dotnet build src/DK2.Tools/DK2.Tools.csproj --configuration Release

      - name: Resolve the base commit
        id: base
        # A pull request compares against its target. A push compares against
        # what was there before, unless that is the zero sha (a new branch or a
        # force push), in which case fall back to the first parent.
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" ;;
          esac
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "comparing against $BASE"

      - name: Check what changed
        # AGENTS.md, "what to record, and how much". Only the changed material
        # is checked; `dk2tools docs --all` reports the backlog and is not a
        # gate.
        run: >
          dotnet run --project src/DK2.Tools --configuration Release --no-build --
          docs --since ${{ steps.base.outputs.sha }}
