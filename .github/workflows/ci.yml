name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Authoritative and deliberately invalid: CI has no Dungeon Keeper 2
  # installation, and no test may quietly depend on one. Tests that need the
  # original game skip themselves when this resolves to nothing.
  DK2_DIR: /nonexistent

jobs:
  docs:
    # The commit-msg hook (.githooks/commit-msg) is the same check, but it is
    # opt-in per clone, passes when DK2.Tools is not built, and --no-verify
    # skips it. This job judges what the push or pull request adds, so a commit
    # that got past the hook still gets judged here.
    name: docs and kb gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build DK2.Tools
        run: dotnet build src/DK2.Tools/DK2.Tools.csproj --configuration Release

      - name: Find the base
        # A pull request is judged against where it forks from its target. A
        # push against the commit it replaced; a new branch, or a force-push
        # whose old tip is gone, has none, so it is judged as its last commit.
        env:
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "judging $(git rev-list --count "$base..HEAD") commit(s) since $base"

      - name: Documentation budgets
        run: dotnet src/DK2.Tools/bin/Release/net10.0/DK2.Tools.dll docs --since "$BASE"

      - name: Function knowledge base
        run: dotnet src/DK2.Tools/bin/Release/net10.0/DK2.Tools.dll kb check --since "$BASE"

      - name: Commit messages
        # Merge commits are skipped: git writes their messages, not the author.
        run: |
          status=0
          msg=$(mktemp)
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            git log -1 --format=%B "$c" > "$msg"
            if grep -qiE '^Co-Authored-By:.*(claude|anthropic|codex|openai|copilot)' "$msg"; then
              echo "$c: AI co-author trailer; use Assisted-by (AGENTS.md)" >&2
              status=1
            fi
            if ! dotnet src/DK2.Tools/bin/Release/net10.0/DK2.Tools.dll docs --message "$msg" >/dev/null; then
              echo "$c: $(git log -1 --format=%s "$c")" >&2
              status=1
            fi
          done
          exit $status

  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms on purpose. The determinism gate pins an exact state
        # hash, so running it on Linux and Windows is what turns "deterministic
        # in this process" into "deterministic across machines".
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DK2.slnx

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Native decision recorder gate (no DK2 install)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/oracle -p test_decision_boundary.py -v

      - name: Performance capture regression tests (no GPU required)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/classic-unity-probe -p "test_*.py" -v

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors, so this is also the
        # style gate.
        run: dotnet build DK2.slnx --no-restore --configuration Release

      - name: Architecture gate (simulation must not reference Unity)
        run: >
          dotnet test tests/DK2.Simulation.Tests/DK2.Simulation.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~ArchitectureTests"

      - name: Determinism gate
        # The project's load-bearing check: same seed and inputs must produce
        # the same state hash at every tick, on every machine. If this fails,
        # nothing downstream that claims behavioural fidelity means anything.
        run: >
          dotnet test tests/DK2.Simulation.Tests/DK2.Simulation.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~DeterminismTests|FullyQualifiedName~SnapshotTests"

      - name: Test
        # EXPECT SKIPS HERE, and read the count. This runner has no Dungeon
        # Keeper 2 installation, so every [InstallFact] / [InstallTheory] test
        # reports as Skipped — 266 of them at the time of writing (ADR-0100).
        #
        # Until 2026-09-07 those tests used `if (install is null) return;` and
        # reported as PASSED, which meant roughly a quarter of a green suite was
        # asserting nothing. If the skip count here ever drops to zero, this
        # runner has somehow acquired the game data; if it climbs sharply,
        # somebody has gated a test that did not need gating.
        #
        # On a machine that IS supposed to have the data, set
        # DK2_REQUIRE_INSTALL=1 to turn a missing install into a failure
        # instead of a skip.
        run: dotnet test DK2.slnx --no-build --configuration Release
