# Replenishment and bought casts, using the shipped threshold and spell cost.
# The Heart opening arms free supply; the strict native deadline gives births
# at modern ticks 37,58,79,100. Starting rosters and replenishment are separate.
# See docs/research/imps-and-mana.md and ADR-0620 for the binary evidence.
# Paid casts run after the free floor is reached, testing rising price and refusal.
# This fixture grants Create Imp because the level does not research it.
# Needs a Dungeon Keeper 2 installation (DK2_DIR).
id: imps-never-run-out-001
question: >
  Does a keeper with a dungeon heart and no imps get four of them, one every
  five seconds - and can they then buy more with mana, at a price that climbs
  fast enough to stop them buying many?
map: campaign:Level1
seed: 11
duration_ticks: 700
setup:
  players:
    # Player 3 owns the 5x5 dungeon heart at (12..16, 26..30) on this level, and
    # starts with enough mana for three imps but not four. Spell 4 is Create Imp,
    # granted here because this level never researches it.
    - { id: 3, gold: 0, mana: 9000, spells: [4] }
commands:
  # Four casts once the free four have arrived, at 20 ticks apart. The last one
  # has nothing to pay with.
  - { at_tick: 450, player: 3, create_imp: true }
  - { at_tick: 470, player: 3, create_imp: true }
  - { at_tick: 490, player: 3, create_imp: true }
  - { at_tick: 510, player: 3, create_imp: true }
observe:
  - state_hash
  - events
# Both halves are named by the shipped data in its own words, which is why this
# is CONFIRMED rather than inferred.
expect:
  - event: imp_generated
    count: 4
    because: >
      MinimumImpThreshold is 4: this fixture starts with none and replenishes
      to that floor after the opening. The fifth is never free.
  - event: imp_generated
    at_tick: 58
    because: >
      The opening arms the native deadline at turn 37; strict comparison permits
      births on modern ticks 37, 58, 79 and 100 (0x004D9ECD, 0x004BB497).
  - event: imp_created
    detail: "cost=1500"
    because: >
      Create Imp's mana cost, read off DK2's own record in KeeperSpells.kwd at
      the offset that holds a plausible cost for all thirteen spells.
  - event: imp_created
    detail: "cost=4500"
    because: >
      The third paid imp at three times the base. The escalation is the owner's
      description of the original and is Q54; that it climbs at all is what
      stops a rich keeper flooding the map.
  - event: create_imp_refused
    detail: "reason=not_enough_mana"
    because: >
      The fourth cast wants 6000 and the land has not earned it. The refusal is
      the mechanic working, not the run running out.
