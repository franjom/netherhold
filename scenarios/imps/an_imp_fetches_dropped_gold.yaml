# The other end of carrying: gold that is already on the floor.
#
# CONFIRMED (Q141, owner observation of the original, 2026-09-05): "if there is
# gold on the ground an imp will first take from that gold pile and take it to a
# treasury, until all of it is gone" - reported from a dungeon where a marked
# gem tile sat right beside the gold and NOBODY WAS MINING IT. So fetching is
# not merely in the imp's priority order, it is ABOVE marked excavation, which
# had been the top of that order since ADR-0018.
#
# This run makes floor gold the only way this project can today - by selling the
# treasury out from under it (ADR-0055) - and then watches an imp put it back.
#
# What the event log actually shows, and it is the whole answer in fifteen lines:
#   t24, t35   the imp is digging the walls marked at tick 2, one after another.
#              MarkedExcavation, which is where the priority order used to start.
#   t40        the treasury tile is sold and its 2000 stays on that tile as a
#              floor pile, off the keeper's books. gold_displaced.
#   t52        it finishes the wall it was already swinging at.
#   t53        and then goes for the gold - fetch_taken, priority
#              FetchFloorGold - WALKING PAST TWO WALLS THAT ARE STILL MARKED.
#              That is the line this scenario exists for.
#   t65-t69    1400 in its hands, delivered; back for the remaining 600.
#              "Until all of it is gone."
#   t70        only now does it return to (12,6) and carry on digging.
#
# ONE NUANCE THAT IS OURS, and the log shows it at t52: the imp finishes the
# wall it is already working on before it turns round. Fetching outranks
# excavation at the moment a job is CHOSEN; whether the original also interrupts
# a swing in progress is Q145, and the owner's own observation cannot settle it,
# because a gem tile is infinite - an imp re-chooses after every completion
# either way, so both rules look identical from outside.
#
# What this run does NOT establish, and the report says so: whether an imp with
# a part-load tops up from a pile it walks past (Q142), whether the original
# animates a pause while picking up (Q143), and whether an enemy keeper's imp
# would take this gold (Q136 - a floor pile's owner is a level-wide player id
# and nobody has read which).
#
# The owner also supplied the negative, and it is reproduced in
# ImpFetchesGoldTests rather than here because it needs a stranded imp: imps put
# onto a marked gem tile NOT connected to the dungeon mined it happily and never
# carried any gold home. Nothing codes that - an imp cannot walk to a store it
# cannot walk to, so the gold simply piles up where it was mined. Whether the
# original's rule is reachability or claimed ground is Q144.
id: imps-fetch-dropped-gold-001
question: >
  Does a worker pick gold up off the floor and carry it to a treasury, and does
  it do that before touching a wall its keeper has marked for digging?
map: chamber_16x12
seed: 5
duration_ticks: 900
setup:
  players:
    # 3000, which the setup spreads in tile order: 1000 fills the heart tile and
    # 2000 goes into (8,6) - the tile that is about to be sold.
    - { id: 3, gold: 3000, mana: 0 }
  rooms:
    # The chamber map opens a 3x3 room in the middle of solid rock, which is
    # exactly what this needs: a row of floor to put rooms on, and diggable
    # walls right beside it.
    - { type: Dungeon Heart, at: [7, 6], player: 3 }
    - { type: Treasury, at: [8, 6], player: 3 }
    - { type: Treasury, at: [9, 6], player: 3 }
  creatures:
    # One imp to start with, so the log is one imp's round trips. The keeper's
    # mana pays for more as the run goes on, which is ImpSupplySystem doing its
    # job rather than anything to do with gold.
    - { type: Imp, at: [9, 6], player: 3 }
commands:
  # Four walls marked for digging BEFORE the gold exists, so the imp is busy
  # with the job that had been top of the priority order, and so there is still
  # marked work left over when the gold appears. Two of these are untouched at
  # t53 and the imp walks past them anyway.
  - at_tick: 2
    player: 3
    tag: [[10, 6], [11, 6], [12, 6], [13, 6]]

  # And now the floor gets gold: the treasury tile is sold and its contents stay
  # where the store was.
  - at_tick: 40
    player: 3
    sell: [[8, 6]]
observe:
  - state_hash
  - events
