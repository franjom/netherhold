# The other end of carrying: gold that is already on the floor.
#
# THIS SCENARIO ASSERTED THE OPPOSITE FOR ONE DAY, and the day is worth keeping.
# The owner reported (Q141): "if there is gold on the ground an imp will first
# take from that gold pile and take it to a treasury, until all of it is gone" -
# watched with a marked gem tile beside the gold and nobody mining it. This
# project read that as fetching OUTRANKING marked excavation, built it, and
# wrote a scenario whose headline was an imp walking past two still-marked walls
# to reach a pile. The owner then read their own report back, said they were not
# sure, and asked for a Ghidra pass rather than letting it stand.
#
# THE BINARY DISAGREES. DK2 keeps a keeper-wide task list whose entries carry a
# kind, and one function tries the kinds in a fixed order, returning on the first
# that takes. Digging and mining a marked tile are kinds 1 and 2 - the FIRST two.
# A floor object flagged TypeGold is kind 7, the SIXTH OF NINE. Kinds 1 and 2 are
# pinned hard: the tile-marking code raises kind 1 when the terrain's GoldValue
# is zero and kind 2 when it is not, which is our own parsed field choosing the
# task type. See docs/research/imp-task-priority.md.
#
# So marked excavation is first, exactly as Q24 and ADR-0018 have had it since
# August, and this run now shows that.
#
# What the event log shows:
#   t24, t35   the imp digs the walls marked at tick 2. MarkedExcavation.
#   t40        the treasury tile is sold and its 2000 stays on that tile as a
#              floor pile, off the keeper's books. gold_displaced.
#   t53, t74   IT KEEPS DIGGING. Two more marked walls, with 2000 in gold lying
#              four tiles away. That is the line this scenario now exists for.
#   t95        only when nothing is marked any more does it go for the gold.
#   t128-      1400 in its hands, delivered; back for the remaining 600.
#              "Until all of it is gone."
#
# WHERE GOLD SITS BELOW DIGGING IS OURS (Q146). Only "below marked excavation"
# is read. It is placed above claiming and reinforcing because putting it last
# would make the mechanic dead - an imp can nearly always find a wall to
# reinforce, so gold would never be collected at all, which is flatly contrary to
# what the owner watched.
#
# AND THE BIGGER QUESTION IS Q147, which may make all of the above moot. The
# original's kind chain is a CALLBACK, invoked from a scan, and every handler
# takes a position and looks around it - so DK2's primary key is WHERE and the
# kind order breaks ties WITHIN a position, where this project runs one whole-map
# search per priority. Under that shape an imp standing in spilled gold takes the
# gold because it is underfoot, not because gold outranks mining, which would
# explain the owner's observation with no priority claim at all. Not built: it
# changes how every job is chosen.
#
# One rule here IS read and is applied: an imp will not take gold that is not on
# its keeper's own ground (or on water). That answers Q144, and it is why the
# owner's disconnected gem tile never sent any gold home - not because the imps
# could not walk back, which is what this project first assumed.
id: imps-fetch-dropped-gold-001
question: >
  Does a worker pick gold up off the floor and carry it to a treasury - and does
  it finish the walls its keeper marked first?
map: chamber_16x12
seed: 5
duration_ticks: 900
setup:
  players:
    # 3000, which the setup spreads in tile order: 1000 fills the heart tile and
    # 2000 goes into (8,6) - the tile that is about to be sold.
    - { id: 3, gold: 3000, mana: 0 }
  rooms:
    # The chamber map opens a 3x3 room in the middle of solid rock, which is
    # exactly what this needs: a row of floor to put rooms on, and diggable
    # walls right beside it.
    - { type: Dungeon Heart, at: [7, 6], player: 3 }
    - { type: Treasury, at: [8, 6], player: 3 }
    - { type: Treasury, at: [9, 6], player: 3 }
  creatures:
    # One imp to start with, so the log is one imp's round trips. The keeper's
    # mana pays for more as the run goes on, which is ImpSupplySystem doing its
    # job rather than anything to do with gold.
    - { type: Imp, at: [9, 6], player: 3 }
commands:
  # Four walls marked for digging BEFORE the gold exists, so there is still
  # marked work left over when it appears. Two of them are untouched at t40 and
  # the imp digs them anyway.
  - at_tick: 2
    player: 3
    tag: [[10, 6], [11, 6], [12, 6], [13, 6]]

  # And now the floor gets gold: the treasury tile is sold and its contents stay
  # where the store was.
  - at_tick: 40
    player: 3
    sell: [[8, 6]]
observe:
  - state_hash
  - events
