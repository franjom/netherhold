# The other end of carrying: gold that is already on the floor.
#
# THIS SCENARIO HAS ASSERTED THREE DIFFERENT ORDERS IN THREE DAYS, and the three
# are worth keeping. The owner reported (Q141) that an imp goes for a pile before
# a marked gem tile; this project built gold FIRST. The owner doubted their own
# report and asked for the binary, which put digging first; this project put gold
# SECOND, above claiming and reinforcing, on the argument that gold placed last
# would never be collected because an imp can nearly always find a wall (Q146).
# Then the owner ran the two-minute experiment the first read proposed (Q147):
# "imps prioritise walls over gold on the floor, in both cases". And the rest of
# the selection routine was read.
#
# THE ORIGINAL CHOOSES IN TWO TIERS (docs/research/imp-task-priority.md, ADR-0058).
# Tier A is kind-first and whole-map: claim the tile just dug, carry objects,
# build traps and doors, DIG AND MINE MARKED TILES, CLAIM FLOOR, carry the
# unconscious, carry corpses -- each searched over the entire map before the
# next. Tier B runs only when Tier A is empty and is position-first: a ring scan
# out from the imp that at every tile tries REINFORCE, then GOLD, then objects.
# So a wall beats gold on the same tile, and a nearer pile beats a farther wall.
# Gold is not last; it is near.
#
# What the event log shows, and every line of it is one of those rules:
#   t0-t23     the imps claim the unowned floor around the room. Claim is a
#              whole-map kind and there is nothing marked yet.
#   t24-t93    four marked walls dug, one after another. MarkedExcavation.
#   t40        the treasury tile is sold and its 2000 stays on that tile as a
#              floor pile, off the keeper's books. gold_displaced.
#   t53, t74   THEY KEEP DIGGING with 2000 in gold lying a few tiles away. Tier A
#              over Tier B: the line the owner's experiment confirmed.
#   t95-t241   THEY CLAIM THE CORRIDOR THEY DUG, and still nobody touches the
#              gold. Claiming is a whole-map kind too, and gold is not.
#   t151-      Tier B begins: every imp reinforces the bare rock BESIDE it,
#              because a wall at distance zero beats a pile at distance two.
#   t417       the first imp to finish a wall that leaves it nearer the pile
#              than any other wall goes and fetches. 1400 in its hands,
#              delivered at t432; 600 left on the floor.
#   t1132      and the rest, on the same terms, once a wall runs out nearer the
#              pile than the next one. "Until all of it is gone" -- just not
#              first.
#
# WHAT IS OURS HERE IS THE DISTANCE. The original measures Tier B in rings of
# straight-line distance; this project measures it in steps along the walkable
# grid (Q25). Everything about the ORDER is read.
#
# A FOURTH ORDER, 2026-10-01 (ADR-0312): the three free imps now land as a
# dropped imp does and look around where they appear, so two of them claim the
# floor next to the pile and take it IN PASSING (t220 and t298, the walk-over
# pick-up of ADR-0293) before any Tier B fetch; a claimer carries its gold on
# (ADR-0288), so the load is not delivered inside this run. The fetch at t295 is
# the one imp whose look found nothing nearer.
#
# One rule here IS read and is applied: an imp will not take gold that is not on
# its keeper's own ground (or on water). That answers Q144, and it is why the
# owner's disconnected gem tile never sent any gold home - not because the imps
# could not walk back, which is what this project first assumed.
id: imps-fetch-dropped-gold-001
question: >
  Does a worker pick gold up off the floor and carry it to a treasury - and does
  it finish the walls its keeper marked first?
map: chamber_16x12
seed: 5
duration_ticks: 1800
setup:
  players:
    # 3000, which the setup spreads in tile order: 1000 fills the heart tile and
    # 2000 goes into (8,6) - the tile that is about to be sold.
    - { id: 3, gold: 3000, mana: 0 }
  rooms:
    # The chamber map opens a 3x3 room in the middle of solid rock, which is
    # exactly what this needs: a row of floor to put rooms on, and diggable
    # walls right beside it.
    - { type: Dungeon Heart, at: [7, 6], player: 3 }
    - { type: Treasury, at: [8, 6], player: 3 }
    - { type: Treasury, at: [9, 6], player: 3 }
  creatures:
    # One imp to start with, so the log is one imp's round trips. The keeper's
    # mana pays for more as the run goes on, which is ImpSupplySystem doing its
    # job rather than anything to do with gold.
    - { type: Imp, at: [9, 6], player: 3 }
commands:
  # Four walls marked for digging BEFORE the gold exists, so there is still
  # marked work left over when it appears. Two of them are untouched at t40 and
  # the imp digs them anyway.
  - at_tick: 2
    player: 3
    tag: [[10, 6], [11, 6], [12, 6], [13, 6]]

  # And now the floor gets gold: the treasury tile is sold and its contents stay
  # where the store was.
  - at_tick: 40
    player: 3
    sell: [[8, 6]]
observe:
  - state_hash
  - events
# Gold on the floor is a job, and it is not the FIRST job.
expect:
  - event: gold_displaced
    detail: "reason=store_sold"
    because: >
      Selling a treasury tile with gold in it puts the gold on the claimed floor
      that replaces it, deducted from the keeper's spendable total until somebody
      fetches it back (CONFIRMED, owner 2026-09-03).
  # Fetching sits below marked excavation and claiming in DK2's Tier A order (Q24, CONFIRMED),
  # so the pile waits for the marks. With every ring scan drawing its start side (ADR-0351), this
  # seed's imps no longer fetch the pile: its last 530 goes in passing. So the fetch is not
  # expected here; ImpFetchesGoldTests.MiningComesBeforeFetching and
  # TheGoldIsStillFetchedOnceTheDiggingIsDone pin the order.
  - event: gold_picked_up_in_passing
    because: >
      The walk-over pick-up (0x0048904E, ADR-0293): a worker passing within a
      third of a tile of a pile takes what its hands can hold without choosing
      it as a job. With the free imps looking around where they land, this is
      how most of the 2000 leaves the floor.
