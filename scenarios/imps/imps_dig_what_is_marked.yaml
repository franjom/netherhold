# The first scenario with somebody in it.
#
# Two imps stand in a small chamber. Their keeper marks a line of rock; the
# imps find it, walk to it and dig it out. Nothing is injected: the only input
# is the tag command, exactly as a player would issue it.
#
# What to read in the event log: a `job_taken` for each imp naming the tile it
# chose, then `destroyed` events as the rock goes. The gap between an imp taking
# a job and the tile going is travel plus one work period.
#
# What this run does NOT establish: how the imps would route around a real
# dungeon (the pathfinder is ours, Q5), and how long any of it takes in seconds
# (Q19/Q1). And one thing it deliberately does not show: the chamber's floor is
# UNOWNED, so nothing here touches the keeper's land and the imps, once the
# corridor is dug, have nothing to claim, reinforce or fetch and stand still.
# The dig-then-claim rhythm the original has (Q154, ADR-0058) needs owned floor
# behind the digging front; tiles/dig_and_claim and the imps' gold scenario show
# it.
id: imps-dig-what-is-marked-001
question: >
  Given only a dig marker, does a worker find the nearest reachable marked
  tile, walk to it and dig it out - and does a second worker join the same
  work rather than waiting?
map: chamber_21x17
seed: 11
duration_ticks: 200
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  creatures:
    # The chamber of chamber_21x17 is the 3x3 around (10, 8).
    - { type: Imp, at: [10, 8], player: 3 }
    - { type: Imp, at: [9, 8], player: 3 }
commands:
  # A corridor east out of the chamber, marked in one go. The imps take the
  # near end first; the far tiles only become reachable once the near ones are
  # gone, which is the point of marking all four at once.
  - { at_tick: 0, player: 3, tag: [[12, 8], [13, 8], [14, 8], [15, 8]] }
observe:
  - state_hash
  - events
# The control run for the slap scenario, and the baseline every timing in it is
# measured against: two imps at 80% Efficiency, nothing touched.
expect:
  - event: job_taken
    detail: "Dig priority=MarkedExcavation"
    because: >
      Marked excavation is the top of DK2's Tier A job table (Q24, CONFIRMED).
      Both imps take the same near tile rather than dividing the corridor between
      them - nothing reserves a tile.
  - event: destroyed
    at_tick: 6
    because: >
      Rock is 165 health and a dig application is the shipped DigRockHealth
      -5000 times Efficiency 0xCCC/4096, shifted down: one strike fells it
      (Q20). The imps choose at tick 1, arrive one and two steps away, and the
      nearer strikes first three ticks after it arrives (ADR-0089, ADR-0280).
  - event: destroyed
    count: 4
    because: >
      All four marks fall: 7, 14, 21, 28. The far tiles only become reachable as
      the near ones go, which is why all four are marked in one command.
