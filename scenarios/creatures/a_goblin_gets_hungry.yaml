# Three Goblins compete for two lair beds; an Imp has neither need.
# Needs use shipped creature values at four native turns per game second.
# Persistent sleep debt and retry timing: ADR-0579.
# This is a simulation regression, not an original-game timing experiment.
id: creatures-a-goblin-gets-hungry-001
question: >
  Do three Goblins take the two beds a two-tile lair has, get hungry after
  exactly the 180 seconds their record gives, walk to bed after 240 and sleep
  for 9 — while an Imp beside them does none of it?
map: flat_24x20
seed: 5
duration_ticks: 5400
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  rooms:
    # A two-tile lair: two beds and no more, which is the whole capacity rule.
    # One bed per tile (ADR-0049, CONFIRMED by the owner).
    - { type: Lair, at: [5, 5], player: 3 }
    - { type: Lair, at: [6, 5], player: 3 }
  creatures:
    # 180 seconds to hunger, one chicken to fill, and a bed of its own
    # (LairObjectId 22). Placed away from the lair so the walk is visible.
    - { type: Goblin, at: [8, 8], player: 3 }
    - { type: Goblin, at: [9, 8], player: 3 }
    # A third, which finds both beds taken and has nowhere to sleep (Q105).
    - { type: Goblin, at: [10, 8], player: 3 }
    # Never hungry, never sleeps, no bed at all — and one of only two creatures
    # that heal on their own land.
    - { type: Imp, at: [5, 5], player: 3 }
commands: []
observe:
  - state_hash
  - events
# Three needs on three clocks, all of them the creature record's own.
expect:
  - event: creature_hungry
    detail: "need=1 after=180s"
    count: 3
    because: >
      HungerRate is 180 game seconds, 720 ticks from each spawn stamp. All
      THREE, because a bed has nothing to do with hunger - the
      goblin with no lair owes exactly what the two in bed owe.
  - event: creature_hungry
    detail: "creature=3 type=Goblin player=3 need=1"
    at_tick: 724
    because: >
      The stamps are staggered by thing tag (0x00476B40, ADR-0782): tags 455, 454
      and 453 stamp our ticks 6, 5 and 4, so the three fall hungry a tick apart.
  - event: creature_hungry
    detail: "creature=1 type=Goblin player=3 need=1"
    at_tick: 726
    because: >
      Tag 455, the first taken from the pool, stamps last.
  - event: going_to_sleep
    at_tick: 965
    because: >
      TimeAwake is 240 game seconds from the spawn stamp, so 240 x 4 after tag
      454's tick 5. Only the two with beds set off; the third has nowhere to go
      (ADR-0579).
  - event: going_to_sleep
    at_tick: 966
    because: >
      And the first Goblin a tick later, from tag 455's tick 6 (ADR-0782).
  - event: woke_up
    detail: "slept=36"
    because: >
      TimeSleep is 9 game seconds, which is 36 ticks. Short only in wall clock:
      at ModifyHealthOfCreatureInLairPerSecond 100 it is 900 of a Goblin's 1500,
      which is why the 240/9 ratio is implemented as written (Q103).
  - event: bed_claimed
    count: 2
    because: >
      One bed per lair tile and two lair tiles (ADR-0049, CONFIRMED by the
      owner). The third goblin gets nothing for the whole run, which is the
      experiment.
  - event: lair_attempt_failed
    detail: "reason=lair_full"
    because: >
      The third asks again at every idle decision and is refused every time. It
      accrues AngerNoLair for HAVING no bed, not for having stopped looking.
