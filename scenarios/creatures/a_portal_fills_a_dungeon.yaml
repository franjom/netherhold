# The whole chain, on level 1's own map, with one dig order and nothing else.
#
# A keeper starts level 1 walled in: a dungeon heart, a few tiles of claimed
# floor, and rock in every direction. Its portal sits three tiles east, owned by
# the **neutral player** (player 2 - PlayerIds, ADR-0043), which is how every
# shipped level ships one. This run marks three tiles for digging and then does
# nothing further. Everything after that is the imps' own:
#
#   t276-324  dig the three tiles (DigOwnWall through the keeper's own
#             reinforced wall, then Dig through rock)
#   t343-396  claim the floor they opened, spreading from land already held
#   t465      take the portal - `room_converted ... tiles=9 from=2`.
#             One tile was worked; eight came with it. CONFIRMED by the owner:
#             rooms are claimed whole, never tile by tile (Q92).
#   t552+     reinforce the new walls, which is priority 3 doing its job
#   t824      the first Goblin
#
# Note t465 + 359 = t824. The portal's clock starts when it is claimed, not
# before - so an idle portal banks nothing for whoever takes it. That is a
# decision, not an observation (Q86), and this run is where you can see it.
#
# A lair is placed on ground the keeper already holds, and it is not decoration:
# **the Goblin's only attraction is a Lair**, so without one this portal produces
# nothing at all however long it waits. That is what makes level 1 teach lairs
# before it gives you anything to put in them - a mechanic, not a script.
#
# And since the lair rework (ADR-0060) the goblins do something on arrival: the
# first walks the eleven tiles to the one-tile lair and puts its bed down
# (`lair_sought` t768, `bed_claimed` t1083); the second finds the lair full at
# its first idle decision and says so every 12 ticks (`lair_attempt_failed
# ... reason=lair_full`, 264 times in this run). That is what one lair tile
# and a working portal look like in the log, and it is the tutorial's lesson
# about lair size told by the simulation rather than the script.
#
# What to read in the event log: the `interval` and `generated` columns on
# `creature_entered`. Level 1 overrides EntranceGenerationSpeedSeconds from the
# game-wide 25 down to **18** - one of five levels that override it - so the
# intervals run 360, 380, 440, 540 ticks: **18, 19, 22, 27 game seconds**, which
# is `n^2 + 18` against this portal's own tally of creatures generated. Fifteen
# is where it would stop: level 1's pool is fifteen Goblins and one portal
# supports fifteen creatures, so the two limits coincide here and a longer run
# cannot tell them apart.
#
# **This log used to read 360, 360, 360, 540 and it was wrong.** The old formula
# was `max(base, base x living creatures / 2)`, taken from OpenKeeper. It agrees
# with the real one at n = 3 and nowhere else - and n = 3, the fourth arrival, is
# the one line of this log anybody had checked. Q86 is now CONFIRMED three ways:
# six instructions at 0x004DBBE0, and two hand-timed runs on the original whose
# gaps match `n^2 + base` to about a second. See ADR-0086.
#
# What this run does NOT establish, and the report repeats it:
# whether the creature pool is a standing limit or a draining quota (Q87); how
# long claiming a portal takes in the original, since only the propagation is
# confirmed and not the rate (Q92); and what the arriving goblins do once they
# have, or cannot get, a bed — nothing, because a non-worker has no job system
# yet, so the second goblin stands on the portal asking for a lair.
id: creatures-a-portal-fills-a-dungeon-001
question: >
  Given one dig order, will a keeper's imps open a route to level 1's neutral
  portal, take it whole, and start receiving the level's own creatures at the
  level's own interval?
map: campaign:level1
seed: 11
duration_ticks: 2600
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  rooms:
    # One tile of lair on ground the keeper already owns. Any size will do -
    # the Goblin's attraction slot carries no minimum, unlike the Bile Demon's
    # 25-tile hatchery.
    - { type: Lair, at: [11, 28], player: 3 }
commands:
  # Three tiles between the keeper's land at (17,28) and the portal at (21,27).
  # (18,28) is the keeper's own reinforced wall; (19,28) and (20,28) are rock.
  # This is the only instruction the run gives.
  - { at_tick: 0, player: 3, tag: [[18, 28], [19, 28], [20, 28]] }
observe:
  - state_hash
  - events
# The two claims worth pinning are the propagation and the interval formula, and
# the second one was wrong in this very file until Q86 was read off the binary.
expect:
  - event: room_converted
    detail: "Portal tiles=9 from=2"
    because: >
      One tile is worked and eight come with it, off the neutral player. Rooms
      are claimed whole, never tile by tile - CONFIRMED by the owner (Q92).
  - event: creature_entered
    detail: "interval=72"
    because: >
      Level 1 overrides EntranceGenerationSpeedSeconds from the game-wide 25 to
      18, and the first arrival is n=0: 0^2 + 18 = 18 game seconds = 72 ticks
      (ADR-0086, ADR-0089).
  - event: creature_entered
    detail: "interval=76"
    because: >
      n=1 gives 1 + 18 = 19 game seconds. This is the line that discriminates:
      the formula taken from OpenKeeper - max(base, base x living / 2) - agrees
      with n^2 + base at n=3 and nowhere else, and predicts 72 here. Six
      instructions at 0x004DBBE0 settled it (Q86).
  - event: creature_entered
    detail: "capacity=15"
    because: >
      One portal supports fifteen creatures, and level 1's pool is fifteen
      Goblins, so the two limits coincide on this map and a longer run cannot
      tell them apart (Q87).
  - event: creature_left
    detail: "via=portal"
    because: >
      A Goblin that never gets a bed reaches the anger ceiling and walks out
      through the portal it came from, which this map - unlike the lair
      scenarios - actually has (Q116).
