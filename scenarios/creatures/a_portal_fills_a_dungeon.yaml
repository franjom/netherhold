# The first scenario in which a creature that is not an imp exists.
#
# Level 1's own map, its own portal and its own balance table. The keeper is
# player 3 - which is what a keeper is, and this run is also the first place
# that distinction is load-bearing: the portal at (21,27) ships owned by player
# 2, the neutral player, and claiming it is what starts its clock. Player 1 is
# the hero side and owns the level's hero gate; player 0 is unmined rock.
#
# Two rooms are laid down. The portal, re-owned to player 3 the way an imp
# claiming it would leave it. And a one-tile lair on (11,28), a floor tile the
# keeper already holds - because **the Goblin's only attraction is a Lair**, so
# without one this portal produces nothing at all, however long it waits. That
# is not a quirk of this run: it is what makes level 1 teach lairs before it
# gives you anything to put in them.
#
# What to read in the event log: `creature_entered` lines, each naming the
# keeper's creature count, their capacity and the interval that arrival waited
# for. The interval is the interesting column. Level 1 overrides
# EntranceGenerationSpeedSeconds from the game-wide 25 down to **18**, so the
# first goblin takes 360 ticks - and the requirement then grows with the
# dungeon, max(base, base x creatures / 2), so the fourth arrival waits 540 and
# the fifteenth would wait 2700. Fifteen is also where it stops: level 1's
# creature pool is fifteen Goblins and one portal supports fifteen creatures, so
# the two limits coincide on this level and a longer run cannot tell them apart.
#
# What this run does NOT establish, and the report repeats it: whether the
# interval scaling is real (it comes from OpenKeeper and nothing in the shipped
# files expresses it - Q86, and a stopwatch on the original settles it); whether
# the pool is a standing limit or a draining quota (Q87); and what the arriving
# goblins then do, which is nothing, because a non-worker has no needs, no job
# and no moods yet.
id: creatures-a-portal-fills-a-dungeon-001
question: >
  Does a claimed portal produce a level's own creatures, at the level's own
  interval, only once something in the dungeon attracts them?
map: campaign:level1
seed: 11
duration_ticks: 1800
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  rooms:
    # The portal itself, claimed. Nine tiles at (21,27); the hole in the middle
    # at (22,28) is where creatures appear and where the spawn clock lives.
    - { type: Portal, at: [21, 27], size: [3, 3], player: 3 }

    # One tile of lair on ground the keeper already owns. Any size will do -
    # the Goblin's attraction slot carries no minimum, unlike the Bile Demon's
    # 25-tile hatchery.
    - { type: Lair, at: [11, 28], player: 3 }
observe:
  - state_hash
  - events
