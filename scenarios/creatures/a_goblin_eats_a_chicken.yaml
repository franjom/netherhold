# Two wounded Goblins eat from a stocked Hatchery. Expectations pin healing,
# hunger repayment and the uninterrupted egg clock across two hunger cycles.
# Behaviour evidence: docs/research/eating.md and hatchery.md (ADR-0066/0067).

id: creatures-a-goblin-eats-a-chicken-001
question: >
  Does a hungry goblin walk to the hatchery, choose the nearest chicken once it
  is inside, eat it for its record's HpFromChicken — and does the room start
  laying again because there is now space?
map: flat_24x20
seed: 5
# Past the 180-second hunger, the walk and the meal, and far enough past that to
# show the hatchery laying again.
duration_ticks: 4200
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  rooms:
    # Two beds, so that "it has nowhere to sleep" is not what this run is about.
    - { type: Lair, at: [10, 10], player: 3 }
    - { type: Lair, at: [11, 10], player: 3 }
    - { type: Hatchery, at: [5, 5], player: 3 }
    - { type: Hatchery, at: [6, 5], player: 3 }
    - { type: Hatchery, at: [7, 5], player: 3 }
    - { type: Hatchery, at: [5, 6], player: 3 }
    - { type: Hatchery, at: [6, 6], player: 3 }
    - { type: Hatchery, at: [7, 6], player: 3 }
    - { type: Hatchery, at: [5, 7], player: 3 }
    - { type: Hatchery, at: [6, 7], player: 3 }
    - { type: Hatchery, at: [7, 7], player: 3 }
  creatures:
    # 900 of 1500: hurt enough that a 375 chicken shows as a number, and above
    # the 50% at which a creature drops what it is doing and goes to bed.
    - { type: Goblin, at: [12, 12], player: 3, health: 900 }
    - { type: Goblin, at: [13, 12], player: 3, health: 900 }
commands: []
observe:
  - state_hash
  - events
# A hungry creature and a stocked room. The three numbers that matter are the
# record's - when it gets hungry, what one bird is worth, and how many birds a
# room will hold - and none of them is ours.
expect:
  - event: creature_hungry
    detail: "need=1 after=180s"
    at_tick: 719
    because: >
      A Goblin's HungerRate is 180 game seconds and the health phase runs on the
      LAST tick of each one, so 180 x 4 - 1 (ADR-0089). One helping owed is
      HungerFill; a Bile Demon would owe five.
  - event: chicken_eaten
    detail: "gained=375"
    because: >
      HpFromChicken off the Goblin's own record, capped at the health it is
      missing - these two are placed at 900 of 1500, so the whole 375 lands
      (ADR-0067).
  - event: chicken_eaten
    detail: "need=0"
    because: >
      One bird pays off ONE helping for a free creature. A prisoner's single
      bird pays off the whole of HungerFill instead, which is the difference
      between the two routes (ADR-0074).
  - event: chicken_chosen
    detail: "steps=1"
    because: >
      The nearest bird once the creature is inside the room, ranked over the
      room's own tiles rather than the map (ADR-0066).
  - event: egg_laid
    at_tick: 755
    because: >
      The room holds one bird per tile, had all nine by tick 259 and refused to
      lay from 279 on. Meals occur at 727 and 728. Hatchery runs before eating,
      so the room is still full on boundary 727; laying resumes at 27 + 26 x 28 = 755.
  - event: egg_laid
    at_tick: 1483
    because: >
      The next meals occur at 1458 and 1459. The unbroken 7s interval resumes
      at 27 + 52 x 28 = 1483; restarting on the first meal would instead lay at 1486.
      This pins the clock continuing through a full room despite changed walking times.
