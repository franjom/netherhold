# Capture: the other branch of DK2's imp task kind 13, and the half of carrying
# that ADR-0063 had to stop short of.
#
# The owner described both halves in one breath (Q99, 2026-09-04):
#
#   "… it remains lying on the ground for a period of time, that gives imps an
#    opportunity to return a creature to its bed in the lair for healing, **or to
#    prison if it is an enemy creature**."
#
# and drew the line between the verbs a day later (2026-09-05):
#
#   "only an imp can drag an enemy creature to prison, a hand of evil can then
#    pick up that creature from prison and drop it around the dungeon, back in
#    prison, or onto a torture rack in the torture chamber."
#
# So capture is an imp's job and only an imp's job. The keeper's hand cannot
# take a body off the floor at all - not a corpse, not somebody bleeding out,
# not an enemy - and the binary agrees: the pick-up handler refuses the state
# flag at bit 0x200000, which DK2's own creature dump names `CreatureDying`
# (Q161, and ADR-0062 had this backwards for a day).
#
# One goblin belonging to player 1, at no health, in player 3's dungeon. Two
# prison tiles and one imp.
#
# What the event log shows, in order:
#
#   t19      `creature_collapsed … rescue_window=60s bed=-1`
#            The rival's goblin, on the first game second. `bed=-1` matters
#            less here than in the burial run: an enemy would not be taken to a
#            bed whatever beds it had.
#
#   t1111    `body_claimed … kind=unconscious`
#            **Not at t20**, and the delay is the original's own ordering
#            rather than sloth. DK2's Tier A job table is `14, 8, 9, 1, 3, 13,
#            12` and claiming comes *before* both carrying kinds
#            (`imp-task-priority.md` §4), so an imp captures nobody while there
#            is unclaimed ground. The whole 9x8 floor takes it eleven hundred
#            ticks.
#
#   t1163    `body_picked_up … to=(6,5)`
#            The cell is chosen here, before the walk, exactly as a bed or a
#            graveyard tile is. A keeper with no prison - or with every cell
#            taken - has an imp that never sets off, which is the manual's
#            *"imps stop collecting prisoners"* falling out of the same rule
#            rather than being written twice.
#
#   t959     `creature_imprisoned … owner=1 (5,3) health=250`
#            **Inside the rescue window**, which ran from t19 to t1219 — the
#            whole tension of the mechanic: a prison too far from the fighting
#            collects corpses instead of prisoners (Q164). The tick moved when
#            the prison became a real 3x3 (ADR-0070); it used to be two cells
#            in a row, which DK2 would not have called a prison at all.
#
#            `owner=1` is the part worth reading twice. **A prisoner changes
#            jailers, not keepers** - it is still player 1's goblin, and DK2
#            keeps the two apart in its own record too, where `PrisonOwner`
#            sits at creature offset 0x3cb next to the ordinary owner field.
#
#            `health=250` is **a sixth of a Goblin**, and it is read from DK2's
#            damage path rather than fitted: taking a creature below zero, when
#            it is not already dying, writes `maxHealth / 6` and raises the
#            `CreatureDying` flag. A flower has **six** petals. Those are the
#            same design decision, and the arithmetic in the binary says so —
#            it computes the sixth as `100 * max / 6 / 100`.
#
#            **This number has been wrong twice and the second time is the
#            instructive one.** The first draft gave a prisoner *full* health on
#            nothing better than the shape of the mechanic; the owner corrected
#            it to *"two petals"*, and this project read that as 20% of maximum
#            because `CreatureCriticalHealthPercentageOfMax` ships at 20 and
#            two-of-ten is 20%. Both halves of that reading failed on
#            2026-09-06: **a flower has six petals, not ten** (Q171), and a raw
#            scan of `.text` finds **one** reference to that variable's global —
#            the loader writing it. Nothing in DK2 reads it. So the countdown
#            went 500 seconds, then 100, and is now **83**.
#
#   t2619    `prisoner_perished … raised=Skeleton as=3`
#            250 health at `PrisonModifyCreatureHealthPerSecond` = -3 a second
#            is 83 game seconds, and 959 + 1660 = 2619. The manual says the
#            ending in its own words: *"any creatures that perish in Prison will
#            rise as Skeletons under your control"*, and the Prison's
#            `CreatedCreatureId` is **9** - one of only two rooms in the shipped
#            table that names a creature at all. The skeleton is **player 3's**,
#            standing where the goblin stood - which since ADR-0073 is **(7,5)**
#            rather than the (5,3) it went in on, because it spent those 83
#            seconds walking.
#
# **What this run does NOT establish**, recorded rather than implied:
#
#   * **Nothing stops the clock.** Chickens are what a keeper feeds a prisoner
#     with, and a keeper cannot yet drop one - so every prisoner here runs its
#     83 seconds out. The owner watched prisoners *"rush toward that chicken,
#     the first one to it gets it, eats it, and its health replenishes"*: they
#     walk about the cell, they compete for the bird, and they eat (Q172).
#
#     **The walking half is built** (ADR-0073) and this run shows it: the goblin
#     takes **50 steps** between t959 and t2619, stands on **all nine** tiles of
#     the 3x3, and never once leaves the room. What is left is the bird (Q195),
#     and it no longer waits on movement - only on a keeper being able to drop
#     one.
#
#   * **The torture chamber**, which is the third place the owner said a lifted
#     prisoner may be dropped. Not built - a prisoner dropped anywhere that is
#     not a prison tile simply goes free.
#
#   * **The jail break.** `OvercrowdingJailBreakPercentagePerExtraCreature` = 50
#     is implemented and rolled once a game second, but a prison can only
#     become overcrowded by a keeper dropping a prisoner into a full one by
#     hand, and this run issues no commands. `PrisonTests` covers it directly.
#     How often the original rolls it is ours (Q168).
#
#   * ~~**How many prisoners a prison holds.**~~ **ANSWERED and CORRECTED**
#     (Q166, ADR-0070). It is the tiles the rim does not take, **plus one**, so
#     the 3x3 here holds **two** - not the nine that "one per tile" gave. The
#     owner read it off DK2's own status bar (*"Captives held: 0 / 2 ...
#     Maximum Skeletons: 2"*) and the arithmetic is in the binary's room
#     capacity routine, which counts free tiles into `SafeCreatureCapacity` and
#     adds one. Below 3x3 the count is zero, the "+1" never fires, and the room
#     is not a prison - which is the owner's other sentence.
#
#   * **Nothing fights.** The goblin was placed at zero health rather than
#     beaten down, because there is no combat. Capture in the original begins
#     with a fight, and this run begins after one.
id: creatures-an-imp-drags-an-enemy-to-prison-001
question: >
  When an enemy creature is beaten down in your dungeon, does an imp drag it to
  your prison - and what happens to it once it is in there?
# Long enough to run the prisoner's whole hundred seconds out, and on the same small
# map the burial scenario uses for the same reason: claiming outranks carrying,
# so a big map is still being claimed when the interesting part should start.
map: flat_9x8
seed: 5
duration_ticks: 4000
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
    - { id: 1, gold: 0, mana: 0 }
  rooms:
    # DK2's smallest working prison: 3x3, which holds TWO (Q166, confirmed off
    # the game's status bar). It used to be two cells in a row here, which under
    # the corrected rule is not a prison at all - no inner tile, no capacity.
    - { type: Prison, at: [5, 3], player: 3 }
    - { type: Prison, at: [6, 3], player: 3 }
    - { type: Prison, at: [7, 3], player: 3 }
    - { type: Prison, at: [5, 4], player: 3 }
    - { type: Prison, at: [6, 4], player: 3 }
    - { type: Prison, at: [7, 4], player: 3 }
    - { type: Prison, at: [5, 5], player: 3 }
    - { type: Prison, at: [6, 5], player: 3 }
    - { type: Prison, at: [7, 5], player: 3 }
  creatures:
    # Somebody else's goblin, at no health, lying in player 3's dungeon.
    - { type: Goblin, at: [2, 2], player: 1, health: 0 }
    # The jailer.
    - { type: Imp, at: [1, 1], player: 3 }
commands: []
observe:
  - state_hash
  - events
# WARNING: these expectations record what this run does NOW, and what it does
# now is NOT what its title says. Nobody is captured. Claiming outranks carrying
# in DK2's Tier A order (Q24, CONFIRMED), the 9x8 floor is all unclaimed, and the
# imp is still claiming when the sixty-second rescue window shuts - so the goblin
# dies on the floor and rots there. That is faithful behaviour and it is also the
# "prison too far from the fighting collects corpses instead of prisoners" edge
# (Q164) rather than the capture this file was written for.
#
# Deliberately NOT repaired by shrinking the unclaimed ground: that is a change
# to the experiment and should be a decision, not a side effect of making a check
# green. Q315.
expect:
  - event: creature_collapsed
    detail: "rescue_window=60s"
    at_tick: 3
    because: >
      CreatureDyingStateDurationSeconds is 60 and the health phase books it on
      the first game second (ADR-0089).
  - event: creature_died
    at_tick: 243
    because: >
      240 ticks later, the window untouched. The imp is claiming for all of it.
  - event: corpse_rotted
    at_tick: 483
    because: >
      DeadBodyDiesAfterSeconds is 60 as well, and there is no graveyard here.
  - event: creature_imprisoned
    absent: true
    because: >
      Q315, recorded rather than hidden: this run captured somebody until the
      prison began deciding admission at the door, and now it does not. If this
      ever fires again, the ordering or the map has changed and this file needs
      re-reading before the change is believed.
