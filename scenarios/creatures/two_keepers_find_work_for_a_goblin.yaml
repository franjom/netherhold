# Job selection for creatures that are not workers - M4's seventh and last
# item. Q2, ADR-0082, docs/research/job-selection.md.
#
# ## What the original does
#
# Three routines roll a creature's job for its mood: FUN_004780e0 happy,
# FUN_004782c0 unhappy, FUN_004784c0 angry (the last of which has been built
# since ADR-0061 and is where leaving the dungeon lives). Each builds cumulative
# ranges from its table's chances, rolls rand(100), tries the job whose range
# holds the roll, and on failure tries every job in the table in record order.
# A re-roll is allowed only after five game seconds, per mood.
#
# What "tries" means is one shared dispatcher, FUN_00478800: a 28-way switch
# from job id to that job's handler. Every handler has the same three parts - a
# cheap test on the keeper or the creature, a search for the nearest suitable
# room, and entering the job's state, which can still fail. That boolean is the
# whole of job availability.
#
# ## Two keepers, one difference, and the difference is a room - then money
#
# The shipped Goblin's HappyJobs is Train at 100% and nothing else. So a Goblin
# with a training room trains, and a Goblin without one has an empty table -
# which is what AngerNoWork is for.
#
# Player 3 has a training room and a temple. Player 4 has neither. Both have
# lairs, because a creature has to have somewhere to live before it does
# anything else (Q150) and because the first draft of the wage-bill scenario
# learned that the hard way.
#
# BOTH ALSO HAVE A TREASURY WITH GOLD IN IT, and since Q205 that is load-bearing
# rather than scenery. Training bills the keeper five gold a game second per
# creature and the original's handler tests the keeper's gold before it looks
# for a room, so a keeper with nothing in the bank is refused the job for
# poverty and never gets as far as finding out whether it built the room. Player
# 3 is given 1200 - enough for about 120 seconds of two Goblins and no more, so
# that the run shows both the training and the end of it. Player 4 is given 500
# and never spends a coin, because it has nowhere to train.
#
# ## The asymmetry worth watching for
#
# ONLY A HAPPY CREATURE IS ANGERED BY HAVING NOTHING TO DO. The happy chooser
# ends, when every job in the table has failed, with a call charging angerNoWork
# (def+0x6c7). The unhappy chooser's identical tail is a bare return, and so is
# the angry one's. A creature that is already unhappy is never made crosser by
# idleness - the grievance belongs to the creature that was fine until its
# keeper ran out of work for it.
#
# The same shape as AngerNoPay having no treasury clause where both its siblings
# test for the room (ADR-0079). Twice now, a plausible symmetry the game does
# not have.
#
# ## What to watch in the run
#
#   * job_taken job=Train effect=built for player 3's Goblins at t1 and t58,
#     then trained every game second: gain=10 a tick, four ticks, 40 a game
#     second. The Goblin's ExpPerSecondTraining is 40 and it divides by variable
#     19 exactly, so this creature loses nothing to the loader's truncation - a
#     Vampire's 30 would deliver 28.
#   * level_up 1->2 at t1584 and t1654, discarded=0. Zero because 3000 is a
#     whole number of awards and not because nothing is ever discarded: DK2
#     ZEROES the balance on promotion and throws the overshoot away, which is
#     why the award's size and cadence are behaviour rather than schedule.
#   * job_lost reason=cannot_pay cost=5 at t2519 and t2539. THE MONEY RUNS OUT.
#     Player 3 was given 1200 gold, two Goblins cost 5 a game second each, and
#     at about t2500 the treasury is empty and both lose the job on the spot.
#     Training is the only job in DK2 a keeper can be evicted from by being poor.
#   * job_refused job=Train reason=no_room for player 4's pair, five game
#     seconds apart - the reselection gate - and no_work between them at 50 a
#     second. Player 4 is FUNDED on purpose: the original's training handler
#     tests the keeper's gold before it looks for a room, so a broke player 4
#     would be refused for poverty and this contrast would vanish.
#   * creature_mood four times, and the pairing is the point. Player 4's Goblins
#     turn Content->Unhappy at t6839/t6879 with worst=Work at 16400 against an
#     unhappy_at of 16383. Player 3's turn at t9339/t9359 with the same numbers -
#     2500 ticks later, because they spent that long training. TWO KEEPERS
#     ARRIVE AT THE SAME UNHAPPY GOBLIN BY DIFFERENT ROUTES: one never built the
#     room, the other could not keep paying for it.
#   * and then nothing more from no_work for any of the four, because they are
#     unhappy now and the unhappy chooser does not charge it.
#   * prayed, once a second, for player 3's Vampire. It is there to be the third
#     creature in a dungeon with two beds, so it never gets one - and its
#     happy table is Research 80% / Praying 20% with no library built, so it
#     falls through to the Temple whatever it rolls. Watch the arithmetic: the
#     Lair bucket takes +100 a second from having no bed and -275 from praying,
#     netting -175. THE TEMPLE OUT-DRAINS A GRIEVANCE THAT IS STILL ACCRUING,
#     and it is the only thing in the game that can touch that bucket at all.
#
# ## What is missing
#
# Two of the nine jobs have an effect: Praying and Training. A creature that
# takes Research, Guard, Drink or Manufacture walks to the room and stands in
# it, and every second of that is a second it is not idle and not accruing
# AngerNoWork - which is behaviour, and is the half of each job the choosers
# actually depend on. But nothing is researched, manufactured, guarded or won.
#
# Research and Manufacture are the nearest to buildable and it is not the rate
# that stops them: ResearchPerSecond and ManufacturePerSecond sit in the same
# four-field family as training's rate, go through the same loader divide, and
# their category hooks (4 and 5) add the result to the PLAYER rather than to the
# creature. What is missing is a keeper with anything to research or make.
#
# The combat rate is read too and cannot be used: ExpPerSecond belongs to
# category 22 - battle, fleeing, responding to a threat - and nothing here
# fights. Across every shipped creature it is exactly five times the training
# rate, which is a designer relationship rather than a coincidence in one
# record.
#
# How long a creature keeps a job is ours, and there is evidence that it is not
# a timer: DK2 ships MotionlessWhileResearching/Manufacturing/Praying/Training
# Seconds, StateCounterWhileGuarding and MinimumJobDurationSeconds, and every
# one of the seven is read by nothing at all - re-confirmed when training was
# read (Q205), along with one variable of a different kind:
# EPLossSecondWhileNotTraining HAS a reader and ships as zero, so DK2 was built
# to make experience decay unless you kept your creatures training and the
# feature was turned off rather than cut.
#
# Evidence: docs/research/job-selection.md, docs/research/training.md.
# Decisions: ADR-0082, ADR-0081, ADR-0083. Questions: Q2, Q203, Q205.

id: creatures-two-keepers-find-work-for-a-goblin-001
question: >
  A Goblin's whole happy table is Train. Does the keeper that built a training
  room get a Goblin who walks to it, is paid 40 experience a game second for
  standing there and reaches level 2 - and then loses the job the second the
  keeper's gold runs out? Does the keeper that built no room get one that takes
  AngerNoWork at 50 a second until it turns unhappy, and do both keepers end up
  with the same unhappy Goblin by different routes?
map: flat_16x10
seed: 11
duration_ticks: 12000
setup:
  players:
    # 1200 gold, which is 120 game seconds of two Goblins training at 5 a
    # second each. Deliberately not enough for the whole run.
    - { id: 3, gold: 1200, mana: 0 }
    # Player 4 is funded on purpose. Training's handler tests the keeper's
    # gold BEFORE it looks for a room, so a broke player 4 would be refused
    # for poverty and the run would never show what this scenario is about.
    # It never spends a coin, because it has nowhere to train.
    - { id: 4, gold: 500, mana: 0 }
  rooms:
    # Player 3: somewhere to live, somewhere to train, somewhere to pray.
    - { type: Lair, at: [2, 2], player: 3 }
    - { type: Lair, at: [3, 2], player: 3 }
    - { type: Training Room, at: [2, 5], size: [2, 2], player: 3 }
    - { type: Temple, at: [5, 2], size: [2, 2], player: 3 }
    # Somewhere to keep the money, because training is billed to the keeper
    # and a keeper's gold lives in treasury tiles or nowhere.
    - { type: Treasury, at: [8, 6], player: 3 }
    # Player 4: somewhere to live, and nothing to do.
    - { type: Lair, at: [12, 6], player: 4 }
    - { type: Lair, at: [13, 6], player: 4 }
    - { type: Treasury, at: [10, 6], player: 4 }
  creatures:
    # Two Goblins standing ON the two lair tiles, so they bed on the first tick
    # and the beds are gone before anything else can walk over. The first draft
    # put them across the map and the Vampire nearer, and the Vampire got a bed
    # - which is correct behaviour (nothing is reserved, ADR-0060) and ruined
    # the demonstration. Both then go and train.
    - { type: Goblin, at: [2, 2], player: 3 }
    - { type: Goblin, at: [3, 2], player: 3 }
    # A third creature for two beds, which is what makes the Temple worth
    # watching: the Vampire never gets one, so its Lair bucket climbs at 100 a
    # second, and praying is the only thing in DK2 that can take it back out.
    - { type: Vampire, at: [7, 3], player: 3 }
    - { type: Goblin, at: [10, 3], player: 4 }
    - { type: Goblin, at: [11, 3], player: 4 }
observe:
  - state_hash
  - events
