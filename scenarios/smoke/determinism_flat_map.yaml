# Plumbing check, not a behavioural experiment.
#
# Confirms the harness can build a world, advance the fixed tick and produce a
# stable per-tick state-hash series. Answers nothing about DK2 itself: no
# simulation systems are registered yet, which the run report states out loud.
id: smoke-determinism-flat-001
question: >
  Does a scenario run over a synthetic map advance the tick and produce a
  reproducible state-hash series?
map: flat_24x20
seed: 12345
duration_ticks: 600
setup:
  players:
    # No gold: a keeper with no treasury has nowhere to keep any, and the run
    # would spend a line of its report saying so. Mana is a player-level pool
    # and needs no room.
    - { id: 3, gold: 0, mana: 1000 }
    - { id: 4, gold: 0, mana: 1000 }
observe:
  - state_hash
  - events
# NO EXPECTATIONS. This run records zero events by design - it exists to show
# that the tick advances and the hash series repeats, which
# RunningTheSameScenarioTwice_ProducesTheSameHashSeries asserts directly.
