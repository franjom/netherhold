# Gold economics at the rock face, on a real campaign map so the seams are
# DK2's own rather than something we placed. The coordinates below were surveyed
# out of Level10Map.kld with `dk2tools kwd map maps/Level10Map.kld 6` (and 7 for
# gems); they are not guesses.
#
# Two things this is looking at:
#   1. a gold seam is finite - 3000 gold over 660 health, mined 60 at a time
#      (Q47), so ELEVEN applications exhaust it, each freeing 273 gold, and it
#      collapses to dirt path;
#   2. a gem face is not - it is impenetrable and its destroyed type is itself,
#      so it collapses (two applications, at 100 health) and immediately
#      reappears at full health, yielding GoldMinedFromGems (25) each cycle.
#      That is why gems are endless but slow.
#
# The gold released is reported and then dropped. Nothing swung: this is work
# injected straight onto the world, so there are no hands for the gold to go into
# (Q31). An imp mining the same seam would carry it - see
# scenarios/imps/an_imp_carries_gold_home.yaml.
#
# Needs a Dungeon Keeper 2 installation (DK2_DIR); the harness reports the
# missing install rather than pretending to run.
id: tiles-mine-gold-001
question: >
  Does mining release gold in proportion to the rock removed for a finite seam,
  and at the flat gems rate for an inexhaustible gem face?
map: campaign:Level10
seed: 11
duration_ticks: 24
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
work:
  # A gold seam. Eleven applications take it from 660 to nothing (Q47).
  - { at_tick: 0, until_tick: 12, player: 3, kind: MineGold, at: [22, 4] }
  # A gem face. Twenty applications, ten collapses at two swings each, ten times
  # 25 gold, and the tile is still gems at the end.
  - { at_tick: 0, until_tick: 19, player: 3, kind: MineGold, at: [8, 75] }
observe:
  - state_hash
  - events
# A seam is finite and a gem face is not, and the difference is entirely in the
# terrain record's DestroyedTypeTerrainId.
expect:
  - event: destroyed
    detail: "(22,4) player=3 MineGold terrain 6->3"
    at_tick: 10
    because: >
      660 health at 60 a swing is eleven swings, ticks 0 to 10 (Q47). The seam
      collapses to Dirt Path and is gone.
  - event: gold_uncollected
    detail: "(22,4) player=3 MineGold amount=273"
    because: >
      3000 gold over 660 health, taken from a running total - so eight swings
      free 273 and three free 272, and the eleven sum to exactly 3000.
  - event: destroyed
    detail: "(8,75)"
    count: 10
    because: >
      Gems are 100 health and their DestroyedTypeTerrainId is THEMSELVES, so the
      face collapses every two swings and immediately comes back at full health.
      Twenty applications, ten collapses, and the tile is still gems at the end.
  - event: gold_uncollected
    detail: "(8,75) player=3 MineGold amount=25"
    because: >
      GoldMinedFromGems is a flat 25 a cycle, independent of the health removed -
      which is why gems are endless and slow where a seam is rich and finite.
