# The first scenario that exercises a real mechanic rather than the plumbing.
#
# A keeper marks three rock tiles, then work is applied to them: dig each one
# out, then claim the floor that appears. The interesting output is the event
# log - which tiles converted, into what, and on which tick.
#
# What this run does NOT establish, and the report repeats it: nothing here
# decided that an imp would do this work, that it could reach the tile, or how
# long any of it takes. The work is injected by the harness because no creature
# exists yet, and the tick numbers are not seconds (Q19/Q1).
id: tiles-dig-and-claim-001
question: >
  Does the data-driven tile rule reproduce DK2's dig-then-claim cycle - rock
  becoming dirt path on destruction, and dirt path becoming claimed path owned
  by the claiming player?
map: rock_20x16
seed: 7
duration_ticks: 80
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
    - { id: 4, gold: 0, mana: 0 }
commands:
  # Marking is a real player command through a real input frame.
  - { at_tick: 0, player: 3, tag: [[5, 5], [6, 5], [7, 5]] }
  # The keeper changes their mind about the third tile.
  - { at_tick: 2, player: 3, untag: [[7, 5]] }
work:
  # DigRockHealth is -500 against Rock's 165 health, and an application is a
  # FIFTH of the tabled delta (Q47) - so 100 a swing and TWO swings, not the one
  # this file asked for until 2026-09-15. It asked for one because it was written
  # when an application was the whole delta; ADR-0089 and Q47 changed that and
  # nothing here noticed, so the dig silently stopped happening and both claims
  # below were refused against rock for months. Q316.
  - { at_tick: 4, until_tick: 5, player: 3, kind: Dig, at: [5, 5] }
  - { at_tick: 4, until_tick: 5, player: 3, kind: Dig, at: [6, 5] }
  # ClaimTileHealth is 825 a second at Efficiency 0xCCC/4096, and the application
  # is an ARITHMETIC SHIFT - so 164 a swing, not the 165 this file assumed, and
  # FIVE swings against Dirt Path's 1/660 rather than four. The shift floors, so
  # upward work loses the fraction and downward work keeps it: a dig at -500
  # rounds to -100 a swing and a claim at +825 rounds to +164. Getting that
  # backwards is what left the fourth swing four health short.
  - { at_tick: 8, until_tick: 12, player: 3, kind: Claim, at: [5, 5] }
  - { at_tick: 8, until_tick: 12, player: 4, kind: Claim, at: [6, 5] }
  # Reinforcing is ReinforceWallHealth 50 a second, so 9 a swing by the same
  # flooring, and Rock's 165 -> 660 is FIFTY-FIVE of them. The file said fifty at
  # 10 and stopped 45 health short every time.
  - { at_tick: 15, until_tick: 69, player: 3, kind: Reinforce, at: [5, 4] }
observe:
  - state_hash
  - events
# The dig-then-claim cycle, one tile at a time, with the swing counts the
# arithmetic actually produces rather than the ones this file used to assume.
expect:
  - event: destroyed
    detail: "Dig terrain 2->3"
    at_tick: 4
    count: 2
    because: >
      Rock 165 health against the shipped DigRockHealth -5000 times Efficiency
      0xCCC/4096, shifted down, is one swing, at tick 4 (Q20, ADR-0280,
      ADR-0089). Rock becomes Dirt Path, which is the terrain record's own
      DestroyedTypeTerrainId.
  - event: transformed
    detail: "Claim terrain 3->8"
    at_tick: 12
    count: 2
    because: >
      Dirt Path 1 -> 660 at +164 a swing is FIVE swings, ticks 8 to 12. Two
      different keepers claim the two tiles, so ownership follows the claimer
      rather than the neighbour.
  - event: transformed
    detail: "Reinforce terrain 2->9"
    at_tick: 69
    because: >
      ReinforceWallHealth 50 a second is +9 a swing by the same flooring, and
      Rock's 165 -> 660 is fifty-five of them from tick 15. Rock becomes
      Reinforced Wall, the record's MaxHealthTypeTerrainId.
