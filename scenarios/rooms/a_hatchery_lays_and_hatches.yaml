# A 3x3 hatchery: floor laying, art-timed hatching, then full-room coop launches.
# Primary evidence and physics boundaries: docs/research/object-drawing.md section 8.
id: rooms-a-hatchery-lays-and-hatches-001
question: >
  Does a hatchery put its coops down, lay eggs on the interval its size implies,
  and do those eggs become chickens?
map: flat_9x8
seed: 5
# Long enough to fill registered room capacity and reach the free-range cap.
duration_ticks: 3000
setup:
  players:
    - { id: 3, gold: 0, mana: 0 }
  rooms:
    - { type: Hatchery, at: [2, 2], player: 3 }
    - { type: Hatchery, at: [3, 2], player: 3 }
    - { type: Hatchery, at: [4, 2], player: 3 }
    - { type: Hatchery, at: [2, 3], player: 3 }
    - { type: Hatchery, at: [3, 3], player: 3 }
    - { type: Hatchery, at: [4, 3], player: 3 }
    - { type: Hatchery, at: [2, 4], player: 3 }
    - { type: Hatchery, at: [3, 4], player: 3 }
    - { type: Hatchery, at: [4, 4], player: 3 }
  creatures: []
commands: []
observe:
  - state_hash
  - events
# The room's whole clock, and every number in it is the room's size.
expect:
  - event: coops_placed
    detail: "added=1 tiles=9 wanted=1"
    because: >
      A 3x3 hatchery wants one coop. How many it wants is derived from the tile
      count rather than stored, which is why a room that grows lays more.
  - event: egg_laid
    detail: "interval=7s"
    because: >
      The interval the nine-tile room implies. It is a property of the ROOM, not
      of the egg: the same interval runs whether the room is full or not.
  - event: chicken_hatched
    detail: "animation=complete"
    because: >
      State32 waits for floor art0, installs hatch-end art5, then creates the
      chicken on the following turn (object-drawing.md section 8).
  - event: egg_laid
    count: 22
    because: >
      Registered room capacity is nine chickens. Full-room launches continue
      until the free-range census reaches twelve (object-drawing.md section 8); this
      fixed seed lays twenty-two eggs over the run, including those launches.
