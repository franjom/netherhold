# The first scenario with an economy in it.
#
# A keeper starts with a dungeon heart and a thousand gold - and the gold is
# *in* the heart, because that is the only place a keeper with no treasury can
# keep any. Six floor tiles are claimed, and the keeper then asks for a six-tile
# treasury on them at 200 gold a tile. Five is what a thousand gold buys, and DK2
# lays none of them: a drag is priced whole before its first tile goes down
# (0x004C5A20; Level 3's recording refused a 7200 Workshop at 7181 gold, ADR-0315).
#
# What to read in the event log: one `built` line naming no tiles, no cost, and
# why - `NotEnoughGold=6`, every placeable tile counted. The state hash does not
# move on the command's tick, because nothing left the heart and no terrain
# changed. Until 2026-10-02 this scenario expected five tiles and one refusal.
#
# What this run does NOT establish, and the report repeats it: whether DK2's
# room cost is per tile or per room (Q32), whether a room must touch land the
# keeper already holds (Q33), how long a keeper's imps would take to build the
# thing (nothing here builds over time), and where mined gold goes (Q31 - the
# treasury this run builds has no way of being filled).
#
# The claiming is injected work, not an imp: claiming is a job an imp starts by
# itself and the trigger for that is UNKNOWN (Q24), so the harness stands in and
# says so.
id: rooms-build-a-treasury-001
question: >
  Does a keeper's gold live in tiles rather than in a counter - so that a room
  is paid for out of a heart or a treasury - and is a drag the keeper cannot pay
  for whole refused whole, with a reason, rather than laid as far as the gold goes?
map: flat_16x12
seed: 5
duration_ticks: 20
setup:
  players:
    - { id: 3, gold: 1000, mana: 0 }
  rooms:
    # One heart tile, which holds exactly MaxGoldPerDungeonHeartTile. The
    # thousand gold above fits in it with nothing to spare, which is why the
    # sixth treasury tile below cannot be paid for.
    - { type: Dungeon Heart, at: [2, 2], player: 3 }
work:
  # FIVE applications a tile, not the one this file asked for until 2026-09-15.
  # ClaimTileHealth is 825 a second, an application is that times Efficiency
  # 0xCCC/4096 arithmetic-shifted down - 164 - and Dirt Path climbs 1 -> 660. The
  # single application was written when an application was the whole delta; after
  # ADR-0089 and Q47 it claimed nothing, so every tile stayed neutral and the
  # build below was refused NotYourLand on all of them. Q316.
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [5, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [6, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [7, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [5, 6] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [6, 6] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [7, 6] }
commands:
  # After tick 4, which is when the claims above finish. It used to be tick 2,
  # which was after the single application that used to be a whole claim.
  - at_tick: 6
    player: 3
    build:
      type: Treasury
      tiles: [[5, 5], [6, 5], [7, 5], [5, 6], [6, 6], [7, 6]]
observe:
  - state_hash
  - events
# Gold lives in tiles, and a drag is all-or-nothing: a keeper who is one tile
# short gets nothing and a reason naming every tile the drag would have laid.
expect:
  - event: built
    detail: "tiles=0 cost=0 refused=NotEnoughGold=6"
    at_tick: 6
    because: >
      Six tiles asked for at the Treasury's own Cost of 200. The heart holds
      exactly MaxGoldPerDungeonHeartTile - 1000 - which buys five, so the
      pre-check refuses the whole drag BY NAME and the heart keeps its thousand.
      The whole-drag refusal is the claim (ADR-0315); the heart as the gold's
      home is the other.
