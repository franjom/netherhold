# The first scenario in which time alone changes something.
#
# A keeper claims eight tiles of floor and then does nothing. Mana arrives once
# a game second, 38 at a time: one per claimed tile, because claimed path is
# worth one mana a second in DK2's terrain table, plus a flat 30 for the
# keeper's dungeon heart. Nothing else on this map is worth anything.
#
# Three seconds in, the keeper paves three of those eight tiles into a treasury.
# The income drops to 35, and it drops for a reason nothing here implements:
# room terrain has a mana gain of zero in all 26 of the game's rooms, so
# building on your own floor takes that floor off the payroll. Read the
# `mana_gained` lines: the rate falls from 38/s to 35/s without a single rule
# knowing that a treasury was involved.
#
# The heart's 30 is counted once for the keeper, not once per heart tile - a
# keeper has at most one dungeon heart ever, and losing it is what defeat is.
# The heart here is one tile because it is also the wallet; a real one is 5x5
# and still worth 30.
#
# What to read in the event log: five `mana_gained` lines, at ticks 19, 39, 59,
# 79 and 99 - the end of each game second - and one `built` line between the
# third and the fourth.
#
# What this run does NOT establish, and the report repeats it: how long a game
# second is (Q1 - TicksPerSecond is a placeholder, so the totals are right and
# the wall-clock rate is not a claim); whether DK2 accrues smoothly or in whole
# seconds; what mana is for, since nothing spends it; and what happens when a
# heart falls, since defeat is not implemented.
#
# The claiming is injected work, not an imp: claiming is a job an imp starts by
# itself and the trigger for that is UNKNOWN (Q24), so the harness stands in and
# says so.
id: mana-land-pays-a-keeper-001
question: >
  Is a keeper's mana income the size of their territory - so that claiming
  ground raises it, and building a room on that same ground lowers it again?
map: flat_16x12
seed: 5
duration_ticks: 100
setup:
  players:
    - { id: 3, gold: 600, mana: 0 }
  rooms:
    # Somewhere to keep the 600 gold the treasury below is paid for with, and
    # the source of the flat 30 a second in every payment below. The tile itself
    # generates nothing - the 30 belongs to the keeper who owns a heart.
    - { type: Dungeon Heart, at: [2, 2], player: 3 }
work:
  # FIVE applications a tile, not the one this file asked for until 2026-09-15.
  # ClaimTileHealth is 825 a second, an application is that times Efficiency
  # 0xCCC/4096 arithmetic-shifted down - 164 - and Dirt Path climbs 1 -> 660. The
  # single application was written when an application was the whole delta; after
  # ADR-0089 and Q47 it claimed nothing, so every tile stayed neutral and the
  # build below was refused NotYourLand on all of them. Q316.
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [5, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [6, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [7, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [8, 5] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [5, 6] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [6, 6] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [7, 6] }
  - { at_tick: 0, until_tick: 4, player: 3, kind: Claim, at: [8, 6] }
commands:
  # Three seconds in, after the third payment: pave three of the eight.
  - at_tick: 60
    player: 3
    build:
      type: Treasury
      tiles: [[5, 5], [6, 5], [7, 5]]
observe:
  - state_hash
  - events
# Income is the size of the territory, and the arithmetic is the terrain table's.
expect:
  - event: mana_gained
    detail: "rate=38/s"
    at_tick: 7
    because: >
      Eight claimed tiles at Claimed Path's 1 mana a second, plus a flat 30 for
      owning a dungeon heart. The first payment after the claims land is the
      clean reading; afterwards the free imps start claiming ground of their own
      and the rate climbs past it.
  - event: built
    detail: "tiles=3 cost=600"
    because: >
      Three of those eight tiles are paved. Room terrain has a mana gain of zero
      in all 26 of the game's rooms, so building on your own floor takes that
      floor off the payroll - the rate falls without a single rule knowing a
      treasury was involved. 600 is three tiles at the Treasury's own Cost of
      200, paid out of the heart.
