# The unaided keeper's attack on a stock map: level 18 gives Nemesis (player 4) IAMinimumCreatures
# 26, IACreatureSkillLevel 4, IAThreatSuperiority 125, NeverAttack 0, IAFirstEnd 2, IAFirstStart 0,
# BreachAtXPoints 1, CallToArmsUsage 0, WaitBeforeAttackingAgain 0, RemoveCallToArmsAfter 60 and
# Call to Arms at availability 3 from its own VARIABLES rows, and its dungeon reaches Fabian's
# (player 5, no creatures) through water a walker wades. The level places no creature of Nemesis's,
# so the scenario stands 27 Black Knights in its Lair and Training Room, 23 at level 4 and four at
# level 1, the kind of army the level's own THINGS records would place. No command is scripted.
# On the first turn the readiness test (0x004FAB10) finds the four under-levelled knights few
# enough to grant each a level, as commands here (ADR-0298), and once its imps are bought the army
# is ready: the planner (0x004FAEF0) passes over the human (player 3, 46 tiles off) and Faust (34)
# for Fabian (32), whose army is empty, chooses her Lair as the room with the least of her own
# strength within five tiles and, walking its rooms newest first as Room_Construct links them, the
# Library as the own room furthest from the heart (the Temple ties and comes later), and starts
# task 7, which ends at once because a route exists. With the last breach used and no call up the
# staging point goes to the Library's position, and attack management (0x004FECE0) casts the call
# there on the next turn through the same action 54 a human uses; the knights answer it, the
# removal test takes it down after 60 turns and it is cast again, and while it stands the front
# (0x004FE9C0) creeps it toward Fabian's heart each turn the army has gathered, recasting at each
# step. The knights follow each step; they do not reach Fabian's dungeon within this run.
#
# What this run does NOT establish: DK2's timing or the creep's exact steps (ours redraws the
# target's diagonal each turn as DK2 does and follows its own router's gate midpoints, Q497).
# No original run of Nemesis attacking has been compared.
