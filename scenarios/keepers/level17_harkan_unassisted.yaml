id: keepers-level17-harkan-unassisted-001
question: >
  Does Harkan expand and build from the stock Level 17 room availability
  without scripted player commands?
map: campaign:level17
seed: 12345
duration_ticks: 1400
viewing_player: 4
computer_keepers: [4]
setup:
  placed_things: true
  players:
    - { id: 1, gold: 0, mana: 0 }
    - { id: 2, gold: 0, mana: 0 }
    - { id: 3, gold: 0, mana: 0 }
    - { id: 4, gold: 10000, mana: 100 }
    - { id: 5, gold: 10000, mana: 100 }
observe:
  - state_hash
  - events
expect:
  - event: destroyed
    detail: "player=4 Dig terrain"
    because: >
      The gold route (tasks 5 and 7) tags the rock between Harkan's dungeon and
      its seam, and the original imp work rule digs tagged rock.
  - event: destroyed
    detail: "player=4 MineGold"
    because: >
      Harkan starts with 10,000 and the Prison he chooses first costs 750 x his
      DefaultRoomSize 25, so the room planner routes to gold (KEEPER_AI.md 5.5).
      DK2's Harkan had mined 3,000 by tick 160 in the original capture
      (computer-keeper-observations.md).
  - event: built
    detail: "player=4 room=Prison"
    because: >
      Once the seam pays for it, the planner digs and builds the Prison, the first
      available missing room (0x004F93B0). DK2's Harkan builds it too, at tick 855
      centred on (16,22); ours grows its Training Room first (359-685) and lays the
      Prison from 1,291 at (17..19, 18..20) (Q555).
  - event: creature_entered
    detail: "player=4"
    because: >
      The portal rule recruits from the level's creature pool after a portal is
      owned. This is ambient recruitment, not a keeper command.
