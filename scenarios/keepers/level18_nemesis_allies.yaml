# The unaided keeper on a stock map: level 18 gives Nemesis (player 4) IAMinimumCreatures 26,
# IACreatureSkillLevel 4, IAThreatSuperiority 125, NeverAttack 0, IAFirstEnd 2, IAFirstStart 0,
# BreachAtXPoints 1, CallToArmsUsage 0 and Call to Arms at availability 3 from its own VARIABLES
# rows. The level places no creature of Nemesis's, so the scenario stands 27 Black Knights in its
# Lair and Training Room, 23 at level 4 and four at level 1. No command is scripted.
# On the first turn the readiness test (0x004FAB10) finds the four under-levelled knights few
# enough to grant each a level, as commands here (ADR-0298).
# Placed knights do not count against the portal cap (0x004DBF90), so the portal also brings
# level-1 creatures in the 400 ticks, and the test grants them levels too.
# Level 18's VARIABLES ally its three computer keepers, Nemesis (4), Fabian (5) and Faust (6)
# (id-66 records, alliances.md section 2), so the planner (0x004FAEF0) never chooses either of them:
# 0x004BF390 calls an ally no enemy. The human (player 3, 46 tiles off) is the only keeper left to
# attack, and this run does not pin whether or when Nemesis goes for it.
#
# What this run does NOT establish: DK2's timing; no original run of Nemesis has been compared.
