# The unaided keeper's attack on a stock map: level 11A gives Drako (player 5) two Mistresses and
# a Salamander, IAMinimumCreatures 2, IACreatureSkillLevel 1, IAThreatSuperiority 30, NeverAttack 0,
# IAFirstEnd 2, IAFirstStart 3, BreachAtXPoints 1, CallToArmsUsage 1 and WaitBeforeAttackingAgain 8.
# No command is scripted; every computer keeper runs, as in DK2. Once its imps are bought the attack planner
# (0x004FAEF0) finds the army ready, passes over the human (player 3), Belial and Raksha for Morgana
# (player 6), chooses her heart as the room with the least of her own strength within five tiles and
# the Lair as the own non-bridge room nearest that heart's first slab, and starts task 7 from the
# Lair toward the heart: the walker steps onto the corridor's first rock, north of the Lair, and
# the next pass tags it with action 40. The cursor waits on a tagged tile until it is dug.
# Two tiles on, the corridor meets lava. Level 11A leaves Drako both bridges at availability 3
# (merged VARIABLES; no trigger changes them), and task 7 (0x004FDC50) spans lava only with a Stone
# Bridge (room 17), placed where the lava touches Drako's own floor (0x0044F630, 0x00453B30). The
# span takes two tiles, the walker steps onto the rock beyond and tags it, and once the tunnel opens
# a route toward Morgana's heart the later attack draws may select another enemy Heart for the call.
# The regression checks the initial corridor and Stone Bridge crossing, then an attacked enemy's
# Heart and the army's engagement. Ambient rat generation and authored portal headings alter the
# shared seeded trajectory; seed 4 is a modern regression, not an original timing oracle.
#
# DK2 crosses here too: the idle capture of 2026-10-06 (computer-keeper-observations.md, Level 11A)
# bridges (64,40) and (64,39) and calls at (64,38). This run matches that capture's conditions: the
# record's own gold and keepers 4 to 7 all running, so Morgana's imps repair the wall Drako digs
# (ADR-0387). What it does NOT establish: why the dug tile is claimed sooner and the call cast
# sooner than DK2's (Q563), or that the neutral player's land stores the tunnel in the original
# (Q497).
id: keepers-level11a-drako-attack-001
question: >
  Does Drako, unaided, tunnel from its Lair toward Morgana's heart, bridge the lava in the way, and
  call its army at an attacked enemy's heart?
map: campaign:level11A
seed: 4
duration_ticks: 700
viewing_player: 5
computer_keepers: [4, 5, 6, 7]
setup:
  placed_things: true
observe:
  - state_hash
  - events
expect:
  - event: tagged
    detail: "player=5 applied=1 rejected=0 span=(64,41)-(64,41)"
    because: >
      Task 7 (0x004FDC50) tags the rock on the cursor's tile with action 40 when the tile is
      taggable and not yet in the task pool: the first tile of rock north of Drako's Lair, on the
      line from its position (64,43) to Morgana's heart position (65,35). The walker stepped onto
      it on an earlier pass.
  - event: built
    detail: "player=5 room=Stone Bridge tiles=1 cost=500 refused=0 first=(64,40)"
    because: >
      The cursor waits on the tagged rock until it is dug and claimed, then steps onto the lava.
      Lava on the cursor takes only room 17 (0x004FDC50), when it is available; the tile touches
      the claimed corridor, Drako's own floor, as the placement test requires (0x0044F630).
      The original capture places this bridge at tick 66; this regression does not pin timing.
  - event: built
    detail: "player=5 room=Stone Bridge tiles=1 cost=500 refused=0 first=(64,39)"
    because: >
      A laid span steps the walker on the same allowance (0x004FDC50); the next lava tile touches
      the bridge just laid, which is owned and not solid (0x00453B30).
      The original capture places this bridge at tick 70; this regression does not pin timing.
  - event: tagged
    detail: "player=5 applied=1 rejected=0 span=(64,38)-(64,38)"
    because: >
      Past the lava the walker meets rock again and task 7 tags it: the tunnel continues toward
      Morgana's heart. Her imps may reinforce and repair that wall (ADR-0387), and her heart
      calls them to fight intruders (ADR-0407). Timing depends on the seed (Q563, Q574).
  - event: call_to_arms_raised
    detail: "player=5"
    because: >
      The front (0x004FE9C0) finds an attack position and attack management casts the call
      (0x004FECE0, ADR-0298). The dedicated test checks that position against an attacked,
      non-allied enemy Heart on the shipped map and verifies the army engages that same Heart.
      DK2's observed call stands at (64,38), at tick 700. Target selection, direction and timing
      remain seed-dependent (Q563, Q574); this modern run does not establish original parity.
  - event: engaged
    detail: "type=Mistress player=5 heart="
    because: >
      Drako's Mistress engages an enemy Heart (scan E, ADR-0163). The dedicated test pairs the
      engagement with the Heart beside the call, beyond bridge construction alone. It does not
      require the call before the first attack or assume the initial enemy remains the target.
