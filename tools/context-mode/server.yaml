name: context-mode
title: Context Mode (project analysis)
type: server
description: Containerized file analysis, indexing, fetching and search; no host session hooks.
image: dk2/context-mode:2.1.7
volumes:
  - '{{context-mode.project_path}}:/workspace:ro'
  - 'dk2-context-mode-content:/data'
config:
  - name: context-mode
    description: Project folder to analyze read-only.
    type: object
    properties:
      project_path:
        type: string
    required:
      - project_path
tools:
  - name: ctx_execute
  - name: ctx_batch
  - name: ctx_index
  - name: ctx_search
  - name: ctx_stats
